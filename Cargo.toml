[package]
name = "zeppelin"
version = "0.2.0"
edition = "2021"
description = "S3-native vector search engine"
license = "Apache-2.0"
repository = "https://github.com/zepdb/zeppelin"
readme = "README.md"
rust-version = "1.85"
publish = false

[features]
default = []
profiling = ["dep:pprof"]
branching-test-support = []
# Exposes the crate-internal two-bit decoders to the fuzz/ targets.
fuzz = []

[[bin]]
name = "zeppelin"
path = "src/main.rs"

[[bin]]
name = "quant_bakeoff"
path = "src/bin/quant_bakeoff.rs"
test = false
bench = false

[[bin]]
name = "mmli_lab"
path = "src/bin/mmli_lab.rs"
test = false
bench = false

[[bin]]
name = "zeppelin_audit_verify"
path = "src/bin/zeppelin_audit_verify.rs"
test = false
bench = false

[[bin]]
name = "zeppelin_advisor"
path = "src/bin/zeppelin_advisor.rs"
test = false
bench = false

[[bin]]
name = "recall_eval"
path = "src/bin/recall_eval.rs"
bench = false

[dependencies]
# HTTP server
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["trace", "cors", "timeout", "limit"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Storage
object_store = { version = "0.11", features = ["aws", "gcp", "azure"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
rmp-serde = "1"
toml = "0.8"

# IDs
ulid = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Concurrency
dashmap = "6"

# Error handling
thiserror = "2"

# Byte buffers
bytes = "1"

# Hashing
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha2 = "0.10"
subtle = "2"
base64 = "0.22"
ed25519-dalek = "2"

# Metrics
prometheus = { version = "0.14", default-features = false }

# Config
dotenvy = "0.15"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async trait
async-trait = "0.1"

# Futures
futures = "0.3"

# Random (for k-means++)
rand = "0.8"

# Half-precision floats (f16)
half = { version = "2", features = ["std", "serde"] }

# Bitmap indexes (pre-filter)
roaring = { version = "0.10", features = ["serde"] }

# Full-text search (BM25)
unicode-segmentation = "1.11"
rust-stemmers = "1.2"

# CPU profiling (optional, behind "profiling" feature)
pprof = { version = "0.15", features = ["flamegraph", "prost-codec"], optional = true }

[profile.release]
debug = 1
lto = "thin"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
rand = "0.8"
tempfile = "3"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tokio-util = "0.7"

[[bench]]
name = "core_benchmarks"
harness = false
