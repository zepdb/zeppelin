openapi: 3.1.0
info:
  title: Zeppelin Vector Search API
  description: S3-native vector search engine with BM25 full-text search support.
  version: 0.2.0
  license:
    name: Apache-2.0

servers:
  - url: http://localhost:8080
    description: Local development server

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Health check
      description: Returns server health status. Always returns 200 if the process is running.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      operationId: readinessCheck
      summary: Readiness check
      description: |
        Verifies S3 connectivity after authorization. Readiness is protected by default:
        anonymous requests receive 401 and authenticated principals without `SystemRead`
        receive 403. Operators may explicitly make only this route public with
        `[security].readyz_public = true`. An authorized request returns 503 if the
        durable audit writer has failed, the storage backend is unreachable, or
        authoritative branch roots require operator repair. Orphan-root repair
        output is capped and contains only namespace/branch identities and digests;
        readiness never removes a root automatically. When `readyz_public` is
        enabled, the 503 remains generic and omits the operator repair bundle so
        the public route cannot become a namespace-lineage oracle.
      tags: [Health]
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: Server is ready
          content:
            application/json:
              schema:
                type: object
                required: [status, s3_connected]
                properties:
                  status:
                    type: string
                    example: ready
                  s3_connected:
                    type: boolean
                    example: true
        "503":
          description: Server is not ready
          content:
            application/json:
              schema:
                type: object
                required: [status, s3_connected]
                properties:
                  status:
                    type: string
                    example: not_ready
                  s3_connected:
                    type: boolean
                    example: false
                  branch_graph_healthy:
                    type: boolean
                    description: False when authoritative branch-root integrity cannot be proved.
                  operator_repair:
                    type: object
                    description: Bounded, operator-safe orphan-root identities and digests.
                    required:
                      - orphan_branch_roots
                      - has_additional_orphan_branch_roots
                      - orphan_branch_roots_limit
                    properties:
                      orphan_branch_roots:
                        type: array
                        maxItems: 16
                        items:
                          type: object
                          additionalProperties: false
                          required:
                            - source_namespace
                            - branch_id
                            - target_namespace
                            - target_incarnation
                            - source_generation
                            - source_manifest_sha256
                            - fork_view_sha256
                            - source_config_sha256
                          properties:
                            source_namespace: { type: string }
                            branch_id: { type: string }
                            target_namespace: { type: string }
                            target_incarnation: { type: string, format: uuid }
                            source_generation: { type: integer, format: int64, minimum: 1 }
                            source_manifest_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                            fork_view_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                            source_config_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                      has_additional_orphan_branch_roots:
                        type: boolean
                      orphan_branch_roots_limit:
                        type: integer
                        minimum: 1
                        maximum: 16
                  error:
                    type: string

  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics
      description: Returns Prometheus-formatted metrics.
      tags: [Health]
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string

  /debug/pprof/cpu:
    get:
      operationId: captureCpuProfile
      summary: Capture a CPU flamegraph
      description: |
        Samples process-wide CPU activity and returns an SVG flamegraph. This
        route is available only when Zeppelin is built with the `profiling`
        feature and requires the same `MetricsRead` grant as `/metrics`.
        `seconds` is clamped to the inclusive range 1–300.
      tags: [Health]
      x-zeppelin-feature: profiling
      parameters:
        - name: seconds
          in: query
          required: false
          description: Sampling duration in seconds.
          schema:
            type: integer
            minimum: 1
            maximum: 300
            default: 30
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: SVG CPU flamegraph
          content:
            image/svg+xml:
              schema:
                type: string
                contentMediaType: image/svg+xml
        "500":
          description: Profiling setup, rendering, or worker failure
          content:
            text/plain:
              schema:
                type: string

  /v1/config/query:
    get:
      operationId: getQueryConfig
      summary: Get runtime query configuration
      description: |
        Returns the current runtime-mutable query knobs. The values are the
        effective snapshot used by new queries until a subsequent PATCH or PUT
        updates the snapshot.
      tags: [Config]
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: Current runtime query configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryKnobs"

    patch:
      operationId: patchQueryConfig
      summary: Patch runtime query configuration
      description: |
        Partially updates runtime query knobs. Omitted fields are left
        unchanged. `rerank_coalesce_gap_bytes` and `cost_latency_profile` are
        mutually exclusive in the same request.
      tags: [Config]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryKnobsPatch"
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: Updated runtime query configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryKnobs"
        "400":
          $ref: "#/components/responses/ValidationError"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    put:
      operationId: putQueryConfig
      summary: Patch runtime query configuration
      description: |
        Alias of PATCH with the same partial-update semantics. Omitted fields
        are left unchanged.
      tags: [Config]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryKnobsPatch"
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: Updated runtime query configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryKnobs"
        "400":
          $ref: "#/components/responses/ValidationError"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/security/principals:
    get:
      operationId: listSecurityPrincipals
      summary: List security principals
      description: |
        Returns the principals in one authoritative policy snapshot. Principal
        metadata is redaction-safe and never includes credential material.
      tags: [Security]
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Principal inventory and its policy version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSecurityPrincipalsResponse"

    post:
      operationId: createSecurityPrincipal
      parameters:
        - $ref: "#/components/parameters/ZeppelinApproval"
      summary: Create a security principal
      description: |
        CAS-publishes a new stable principal in the next immutable policy
        snapshot. A principal does not authenticate until it has a key and does
        not authorize requests until it has an explicit grant.
      tags: [Security]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecurityPrincipalRequest"
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Principal created in a new policy version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSecurityPrincipalResponse"
        "400":
          $ref: "#/components/responses/SecurityRequestError"
        "409":
          $ref: "#/components/responses/SecurityPolicyConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/security/keys:
    get:
      operationId: listSecurityKeys
      summary: List redacted API-key metadata
      description: |
        Returns credential lifecycle metadata from one policy snapshot. The
        response deliberately excludes both plaintext API-key secrets and stored
        SHA-256 digests.
      tags: [Security]
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Redacted key inventory and its policy version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSecurityKeysResponse"

    post:
      operationId: createSecurityKey
      parameters:
        - $ref: "#/components/parameters/ZeppelinApproval"
      summary: Issue an API key
      description: |
        Generates a high-entropy API key for an existing principal and
        CAS-publishes only its SHA-256 digest. `api_key` is returned exactly once
        in this response and cannot be recovered from later list operations.
      tags: [Security]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecurityKeyRequest"
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Key digest published; plaintext credential returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueSecurityKeyResponse"
        "400":
          $ref: "#/components/responses/SecurityRequestError"
        "404":
          $ref: "#/components/responses/SecurityEntityNotFound"
        "409":
          $ref: "#/components/responses/SecurityPolicyConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/security/keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/SecurityKeyPath"

    delete:
      operationId: revokeSecurityKey
      parameters:
        - $ref: "#/components/parameters/ZeppelinApproval"
      summary: Revoke an API key
      description: |
        CAS-publishes a revoked state and writes the new policy through to the
        mutating node immediately. Other nodes enforce it within twice the
        configured policy refresh interval.
      tags: [Security]
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Key revoked in a new policy version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeSecurityKeyResponse"
        "400":
          $ref: "#/components/responses/SecurityRequestError"
        "404":
          $ref: "#/components/responses/SecurityEntityNotFound"
        "409":
          $ref: "#/components/responses/SecurityPolicyConflict"

  /v1/security/keys/{key_id}/rotate:
    parameters:
      - $ref: "#/components/parameters/SecurityKeyPath"

    post:
      operationId: rotateSecurityKey
      parameters:
        - $ref: "#/components/parameters/ZeppelinApproval"
      summary: Rotate an API key
      description: |
        Issues a replacement credential and marks its predecessor revoked at the
        requested overlap deadline. The replacement `api_key` is returned exactly
        once; subsequent reads expose only redacted lifecycle metadata.
      tags: [Security]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateSecurityKeyRequest"
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Replacement key published and plaintext returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateSecurityKeyResponse"
        "400":
          $ref: "#/components/responses/SecurityRequestError"
        "404":
          $ref: "#/components/responses/SecurityEntityNotFound"
        "409":
          $ref: "#/components/responses/SecurityPolicyConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/security/grants:
    get:
      operationId: listSecurityGrants
      summary: List security grants
      description: Returns every exact principal, tagged scope, and tagged action set in one policy snapshot.
      tags: [Security]
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Grant inventory and its policy version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSecurityGrantsResponse"

    post:
      operationId: createSecurityGrant
      parameters:
        - $ref: "#/components/parameters/ZeppelinApproval"
      summary: Create a security grant
      description: |
        CAS-publishes one exact grant. Scope and actions are strict tagged
        objects; unknown fields, empty selected action sets, and duplicate
        selected actions are rejected. Every applicable grant participates in
        authorization: mandatory filters are ANDed, field-mask deny sets are
        unioned, and write constraints are merged. Conflicting stamp values are
        rejected before an immutable policy object or head is published.
      tags: [Security]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityGrantMutationRequest"
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Grant published in a new policy version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityGrantMutationResponse"
        "400":
          $ref: "#/components/responses/SecurityRequestError"
        "404":
          $ref: "#/components/responses/SecurityEntityNotFound"
        "409":
          $ref: "#/components/responses/SecurityPolicyConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      operationId: deleteSecurityGrant
      parameters:
        - $ref: "#/components/parameters/ZeppelinApproval"
      summary: Remove a security grant
      description: CAS-removes the grant binding that matches the supplied principal, scope, and actions.
      tags: [Security]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityGrantRemovalRequest"
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Grant removed in a new policy version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityGrantMutationResponse"
        "400":
          $ref: "#/components/responses/SecurityRequestError"
        "404":
          $ref: "#/components/responses/SecurityEntityNotFound"
        "409":
          $ref: "#/components/responses/SecurityPolicyConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/security/policy:
    get:
      operationId: getSecurityPolicy
      summary: Get active security policy metadata
      description: |
        Returns the active S3 head and redaction-safe snapshot metadata. The
        response includes the immutable object key and checksum but not key
        digests or plaintext credentials.
      tags: [Security]
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Active policy head and snapshot metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityPolicyMetadataResponse"

  /v1/security/tokens:
    post:
      operationId: mintDelegatedSecurityToken
      summary: Mint a narrowed delegated token
      description: |
        Mints one short-lived Ed25519 `zpt1_` bearer whose effective authority
        is always the current parent's grants intersected with this request.
        Actions, namespaces, and the optional mandatory filter only narrow;
        parent authority is checked at mint and again on every use. The token is
        returned exactly once and cannot mint another delegated token.
      tags: [Security]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintDelegatedTokenRequest"
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Delegated bearer minted and returned exactly once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintDelegatedTokenResponse"
        "400":
          $ref: "#/components/responses/SecurityRequestError"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/security/preservation:
    get:
      operationId: listPreservationLocks
      summary: List active preservation locks
      description: |
        Returns the fresh S3-authoritative active lock set. If the cached head
        cannot be refreshed within its bounded freshness interval, the request
        fails closed with 503 rather than returning uncertain state.
      tags: [Security]
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Fresh active preservation-lock inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPreservationLocksResponse"
        "503":
          $ref: "#/components/responses/PreservationStateUnavailable"
    post:
      operationId: createPreservationLock
      summary: Create an active preservation lock
      description: |
        Writes an immutable lock record, then CAS-adds its identity to the
        authoritative active head. Namespace-filter overlap is conservative:
        deletion is blocked unless disjointness is structurally provable.
      tags: [Security]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePreservationLockRequest"
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Immutable lock created and activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreservationLockRecord"
        "400":
          $ref: "#/components/responses/PreservationRequestError"
        "409":
          $ref: "#/components/responses/PreservationConflict"
        "500":
          $ref: "#/components/responses/AuditUnavailable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/security/preservation/{lock_id}/release:
    post:
      operationId: releasePreservationLock
      summary: Release an active preservation lock
      description: |
        Appends an immutable release record and CAS-removes the lock from the
        active head. A distinct authorized zpk1 principal must be supplied in
        X-Zeppelin-Approval; delegated tokens cannot satisfy approval.
      tags: [Security]
      parameters:
        - name: lock_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/PreservationLockId"
        - name: X-Zeppelin-Approval
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/SecurityApiKey"
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Immutable release evidence written and lock deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreservationLockRecord"
        "400":
          $ref: "#/components/responses/PreservationRequestError"
        "404":
          $ref: "#/components/responses/PreservationLockNotFound"
        "409":
          $ref: "#/components/responses/PreservationConflict"
        "500":
          $ref: "#/components/responses/AuditUnavailable"

  /v1/namespaces:
    post:
      operationId: createNamespace
      summary: Create a namespace
      description: |
        Creates a new namespace with the specified dimensions and distance metric.
        If `name` is omitted, the server generates a UUID v4 namespace name for
        backward compatibility. If `name` is present, it must be 1-255
        characters, start with an ASCII alphanumeric character, contain only
        ASCII alphanumeric, dash, underscore, or dot characters, and be safe as
        both an S3 top-level key prefix and a single URL path segment.

        Client-specified names are idempotent: the same name with the same
        immutable configuration returns `200` and the existing namespace;
        the same name with different dimensions, distance metric, or full-text
        search configuration returns `409` with code `NAMESPACE_ALREADY_EXISTS`.
      tags: [Namespaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNamespaceRequest"
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: Existing namespace returned for idempotent create-by-name with identical configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateNamespaceResponse"
        "201":
          description: Namespace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateNamespaceResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/NamespaceAlreadyExistsError"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/namespaces/{ns}:
    parameters:
      - $ref: "#/components/parameters/NamespacePath"

    get:
      operationId: getNamespace
      summary: Get namespace
      description: Returns metadata for a single namespace.
      tags: [Namespaces]
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: Namespace metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespaceResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"

    delete:
      operationId: deleteNamespace
      parameters:
        - $ref: "#/components/parameters/ZeppelinApproval"
      summary: Delete namespace
      description: |
        Marks a namespace as deleting and starts resumable background cleanup.
        Re-issuing DELETE while cleanup is in progress resumes cleanup. Once
        cleanup finishes, the namespace returns 404. A namespace with direct
        branch roots returns 409. Deleting a child branch intentionally keeps
        that 409 in force through its durable reader-safety grace and parent-root
        release. Conflict details list only children the caller may currently
        read and never include an exact total.
      tags: [Namespaces]
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "202":
          description: Namespace deletion accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteNamespaceResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/NamespaceDeleteConflict"
        "500":
          $ref: "#/components/responses/AuditUnavailable"
        "503":
          $ref: "#/components/responses/PreservationStateUnavailable"

  /v1/namespaces/{ns}/snapshots:
    parameters:
      - $ref: "#/components/parameters/NamespacePath"

    get:
      operationId: listNamespaceSnapshots
      summary: List namespace snapshots
      description: |
        Lists named point-in-time snapshot pins for a namespace. Each snapshot
        pins one committed manifest generation so GC retains that generation's
        history snapshot and all artifacts reachable from it.
      tags: [Namespaces]
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: Named snapshot pins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSnapshotsResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "410":
          $ref: "#/components/responses/NamespaceDeletingError"

  /v1/namespaces/{ns}/snapshots/{name}:
    parameters:
      - $ref: "#/components/parameters/NamespacePath"
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: Snapshot name

    put:
      operationId: putNamespaceSnapshot
      summary: Create namespace snapshot
      description: |
        Creates a named point-in-time snapshot pin for the namespace's current
        committed manifest generation. Repeating the request for the same name
        and generation is idempotent. Reusing the name after the namespace has
        advanced to a different generation returns 409 with code
        `SNAPSHOT_ALREADY_EXISTS`.
      tags: [Namespaces]
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "201":
          description: Snapshot pin created or already existed for this generation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/SnapshotAlreadyExistsError"
        "410":
          $ref: "#/components/responses/NamespaceDeletingError"

    get:
      operationId: getNamespaceSnapshot
      summary: Get namespace snapshot
      description: Returns one named point-in-time snapshot pin.
      tags: [Namespaces]
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: Named snapshot pin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "410":
          $ref: "#/components/responses/NamespaceDeletingError"

    delete:
      operationId: deleteNamespaceSnapshot
      parameters:
        - $ref: "#/components/parameters/ZeppelinApproval"
      summary: Delete namespace snapshot
      description: |
        Releases a named snapshot pin. The generation it pinned then falls
        back to the normal count and time-based PITR retention rules.
      tags: [Namespaces]
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "204":
          description: Snapshot pin released
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/PreservationLocked"
        "410":
          $ref: "#/components/responses/NamespaceDeletingError"
        "503":
          $ref: "#/components/responses/PreservationStateUnavailable"

  /v1/namespaces/{ns}/branches:
    parameters:
      - $ref: "#/components/parameters/NamespacePath"

    get:
      operationId: listNamespaceBranches
      summary: List direct namespace branches
      description: |
        Returns only direct child targets for which the caller currently has
        NamespaceRead. Disclosure is checked before target metadata is read;
        denied targets are omitted without affecting names, counts, status, or
        errors. Policy freshness failure fails the whole request closed. A
        missing or mismatched authorized target returns the generic
        `branch_integrity_error` without exposing the target identity.
      tags: [Namespaces]
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: Direct branch descriptors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchListResponse" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "500":
          description: |
            An authorized direct child's root and metadata identity failed
            integrity validation. The canonical error envelope uses code
            `branch_integrity_error` and omits child identities.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    post:
      operationId: createNamespaceBranch
      summary: Create a live-head copy-on-write branch
      tags: [Namespaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForkNamespaceRequest" }
      responses:
        "201":
          description: Branch created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForkNamespaceResponse" }
        "200":
          description: Existing exact branch intent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForkNamespaceResponse" }
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /v1/namespaces/{ns}/clone:
    parameters:
      - $ref: "#/components/parameters/NamespacePath"

    post:
      operationId: cloneNamespace
      summary: Restore namespace as clone
      description: |
        Creates a fresh target namespace from a retained source manifest
        generation. The server materializes the clone by copying source
        artifacts into the target namespace prefix and rewriting manifest
        references, so the target is independently writable and remains
        readable after source deletion or source GC. Authorization requires
        NamespaceClone and NamespaceRead on the source plus NamespaceCreate on
        the target. All three allow decisions must be unconstrained and carry
        the same policy version. Before publication, the kernel also proves
        policy-wide source-to-target dominance: every principal and raw-copy
        observation or mutation action must be denied on the target or be no
        broader there than on the source.
        Cloning never copies or creates a security grant for the target namespace.
        Access requires an
        independently applicable global grant or a target-specific grant that
        an administrator publishes after the clone is created.
      tags: [Namespaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloneNamespaceRequest"
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "201":
          description: Clone materialized into a fresh namespace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloneNamespaceResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/NamespaceAlreadyExistsError"
        "410":
          $ref: "#/components/responses/GoneError"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/namespaces/{ns}/index_config:
    parameters:
      - $ref: "#/components/parameters/NamespacePath"

    patch:
      operationId: updateNamespaceIndexConfig
      summary: Stage namespace index config
      description: |
        Stages per-namespace indexing parameters for future compactions. The
        response returns after `meta.json` is updated; the active segment is
        rewritten asynchronously on the next compaction. Observe progress and
        health with `GET /v1/namespaces/{ns}`.
      tags: [Namespaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchNamespaceIndexConfigRequest"
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "202":
          description: Index config update accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateIndexConfigResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "410":
          $ref: "#/components/responses/NamespaceDeletingError"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/namespaces/{ns}/compact:
    parameters:
      - $ref: "#/components/parameters/NamespacePath"

    post:
      operationId: compactNamespace
      summary: Trigger namespace compaction
      description: |
        Starts one asynchronous, lease-protected compaction cycle for a namespace.
        Empty namespaces and namespaces with no uncompacted WAL fragments return
        `200` with status `noop` and do not acquire the compaction lease. If
        another writer holds the namespace compaction lease, the endpoint
        returns the canonical `409` envelope with code `CONFLICT_RETRY`. A
        non-empty accepted trigger returns `202` with the current manifest
        generation; clients should poll `GET /v1/namespaces/{ns}/compact/status`
        until `uncompacted_fragments` reaches zero.
      tags: [Namespaces]
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: No compaction was needed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompactNamespaceResponse"
        "202":
          description: Compaction was accepted and is running asynchronously
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompactNamespaceResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictRetry"
        "410":
          $ref: "#/components/responses/NamespaceDeletingError"

  /v1/namespaces/{ns}/compact/status:
    parameters:
      - $ref: "#/components/parameters/NamespacePath"

    get:
      operationId: getCompactionStatus
      summary: Get compaction status
      description: |
        Returns manifest-derived compaction status for clients that need to
        wait until all WAL fragments have been compacted without polling query
        results.
      tags: [Namespaces]
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: Manifest-derived compaction status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompactionStatusResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "410":
          $ref: "#/components/responses/NamespaceDeletingError"

  /v1/namespaces/{ns}/hydrate:
    parameters:
      - $ref: "#/components/parameters/NamespacePath"

    post:
      operationId: triggerNamespaceHydration
      summary: Queue namespace hydration
      description: |
        Asynchronously queues the namespace's current active segment for
        warm-set hydration. The response is returned after enqueueing; it does
        not wait for segment objects to finish downloading into the local cache.

        A `202` response means the request entered the hydrator pipeline. The
        pipeline still applies incremental-segment and capacity safety gates.
        Gate refusals also return `202` here and are observable through
        `zeppelin_hydration_skipped_total`, `zeppelin_hydration_refused`, and
        `zeppelin_hydration_required_bytes`.
      tags: [Namespaces]
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "202":
          description: Hydration request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HydrateNamespaceResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/HydrationDisabled"

  /v1/namespaces/{ns}/vectors:
    parameters:
      - $ref: "#/components/parameters/NamespacePath"

    post:
      operationId: upsertVectors
      summary: Upsert vectors
      description: |
        Insert or update vectors in a namespace. Vectors with existing IDs are
        overwritten. The request body is bounded by `server.max_request_body_mb`
        and the logical `vectors` array is bounded by `server.max_batch_size`.
        Accepted requests are committed all-or-nothing as one bounded WAL
        fragment; oversized bodies or batches return the canonical 413
        `PAYLOAD_TOO_LARGE` envelope before any WAL ref is committed. When the
        authorization decision carries write constraints, server stamps
        overwrite caller values on every row and supplying any `forbid_set`
        field rejects the whole batch with 403 `constraint_violation` before a
        WAL fragment is published. Under a mandatory filter, caller-supplied
        IDs are update-only: both an absent ID and an existing out-of-slice ID
        are denied with the same 403 shape. A scoped create instead omits `id`;
        the server assigns an opaque server-owned identity and returns it in
        `generated_ids`. Unconstrained creates continue to require caller IDs.
        Every final, stamped row must remain inside the caller's slice.
      tags: [Vectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertVectorsRequest"
          application/msgpack:
            schema:
              $ref: "#/components/schemas/MessagePackUpsertRequest"
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: Vectors upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsertVectorsResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "410":
          $ref: "#/components/responses/NamespaceDeletingError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

    delete:
      operationId: deleteVectors
      parameters:
        - $ref: "#/components/parameters/ZeppelinApproval"
      summary: Delete vectors
      description: |
        Delete vectors by an explicit ID list or by an exact attribute filter.
        The two selectors are mutually exclusive. Server-owned mandatory
        filters are always ANDed into the selection before tombstones publish.
        Explicit IDs outside the permitted row slice are ignored in exactly the
        same way as nonexistent IDs, without exposing an existence distinction.
      tags: [Vectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteVectorsRequest"
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "204":
          description: Vectors deleted
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/PreservationLocked"
        "410":
          $ref: "#/components/responses/NamespaceDeletingError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/PreservationStateUnavailable"

  /v1/namespaces/{ns}/vectors/get:
    parameters:
      - $ref: "#/components/parameters/NamespacePath"

    post:
      operationId: getVectors
      summary: Fetch vectors by ID
      description: |
        Fetch explicit vector IDs with projection controls. Found records are
        returned in request order. Missing IDs and tombstoned IDs are reported
        in `missing` and are never silently mapped to another record. For a
        principal with a mandatory filter, an existing ID outside the allowed
        row slice is reported in exactly the same `missing` shape and order as
        a nonexistent ID; the response exposes no existence distinction.

        `consistency=strong` sees latest committed WAL writes and deletes.
        `consistency=eventual` reads the active segment plus WAL tombstones, so
        it may miss recent uncompacted upserts while still suppressing deleted
        segment records.
      tags: [Vectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetVectorsRequest"
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: Fetched records and explicit missing IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetVectorsResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "410":
          $ref: "#/components/responses/NamespaceDeletingError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /v1/namespaces/{ns}/query:
    parameters:
      - $ref: "#/components/parameters/NamespacePath"
      - name: as_of
        in: query
        required: false
        schema:
          type: string
        description: |
          Optional point-in-time target. Use a manifest generation number, an
          RFC 3339 timestamp, or `snapshot:<name>` to query a retained
          historical manifest instead of the live manifest. Reads near the
          retention boundary can fail with `POINT_IN_TIME_NOT_RETAINED` if the
          selected generation is pruned and swept while the query is in flight;
          retry with a still-retained generation or named snapshot. The
          principal's current policy constraints always apply to the selected
          historical data; an older manifest never restores older access. A
          cursor chain binds this exact selector, so every continuation must
          repeat the same `as_of` value.

    post:
      operationId: queryNamespace
      summary: Query vectors
      description: |
        Run vector similarity search, BM25 full-text search, or typed
        retrieval-algebra search. Legacy requests provide exactly one of
        `vector` or `rank_by`; retrieval-algebra requests provide typed
        `sources`, with multi-source `ann` + `bm25` fusion supported by RRF
        or weighted normalized score. A server-owned mandatory filter is always
        ANDed with the caller filter for live and `as_of` reads. Policy-masked
        attributes are omitted from results. Masked fields cannot be referenced
        by caller filters or ranking expressions and cannot be selected as
        facet or grouping output fields; such requests fail 403
        `constraint_violation`. Row-scoped responses report zero physical scan
        counters, and `debug: true` is rejected with
        `constraint_violation`, because namespace-wide storage diagnostics can
        reveal activity outside the permitted row slice.
      tags: [Query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: Query results
          headers:
            x-request-id:
              schema:
                type: string
              description: Echo of the inbound request id, or a server-generated UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "410":
          $ref: "#/components/responses/GoneError"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /v1/namespaces/{ns}/query/batch:
    parameters:
      - $ref: "#/components/parameters/NamespacePath"

    post:
      operationId: batchQueryNamespace
      summary: Batch query vectors
      description: |
        Run multiple vector similarity or BM25 full-text searches in one
        request. Each entry uses the same body shape as `POST
        /v1/namespaces/{ns}/query`.

        Results are returned positionally. A failure in one entry is reported
        in that entry's error envelope and does not fail the whole batch.
        Entries share one manifest freshness check and segment metadata load.
      tags: [Query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchQueryRequest"
      responses:
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "200":
          description: Positional batch query results
          headers:
            x-request-id:
              schema:
                type: string
              description: Echo of the inbound request id, or a server-generated UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchQueryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          $ref: "#/components/responses/NotImplemented"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Zeppelin API key
      description: |
        Named Zeppelin API key in canonical `zpk1_<key-id>.<secret>` form.
        Send it as `Authorization: Bearer <api-key>`.

  parameters:
    NamespacePath:
      name: ns
      in: path
      required: true
      schema:
        type: string
      description: Namespace name
    SecurityKeyPath:
      name: key_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SecurityKeyId"
      description: Stable public API-key identifier; never includes the secret suffix.
    ZeppelinApproval:
      name: X-Zeppelin-Approval
      in: header
      required: false
      description: |
        Raw `zpk1_...` credential for an independent secondary approver when
        the effective policy requires two-person approval. Do not prefix this
        value with `Bearer`. This credential is secret and must be redacted from
        logs, traces, diagnostics, and error responses.
      schema:
        type: string
        pattern: '^zpk1_[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
        writeOnly: true

  responses:
    UnauthorizedError:
      description: |
        Authentication required or the supplied credential is unknown, malformed,
        or expired (401). The canonical error envelope carries a stable security
        reason code and never exposes credential material.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: |
        The authenticated principal is not authorized for the requested action or
        resource, or the operation violates a server-owned mandatory filter,
        field mask, or write constraint (403). Security-management routes also
        use this envelope for `feature_not_licensed` when Rbac is absent and
        `license_expired` when the post-expiry management grace has elapsed.
        Expiry never disables Rbac, Constraints, or AuditS3 enforcement.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SecurityRequestError:
      description: |
        The requested security-policy mutation is invalid (400). The canonical
        error envelope uses code `invalid_security_request` and does not echo
        credential or storage material.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SecurityEntityNotFound:
      description: |
        The requested principal, key, or exact grant does not exist (404). The
        canonical error envelope uses code `security_entity_not_found`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SecurityPolicyConflict:
      description: |
        The entity already exists (`security_entity_exists`, not retryable), or
        bounded policy-head CAS retries were exhausted (`security_conflict`,
        retryable). Retryable responses carry `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds to wait when `retryable` is true.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PreservationRequestError:
      description: |
        The preservation request or lock identifier is invalid (400). The
        canonical error envelope uses code `invalid_preservation_request`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PreservationLockNotFound:
      description: |
        The requested preservation lock is not active or does not exist (404).
        The canonical error envelope uses code `preservation_lock_not_found`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PreservationConflict:
      description: |
        Bounded preservation-head CAS retries were exhausted or a concurrent
        transition superseded the requested release (409). The canonical error
        envelope uses code `preservation_conflict` and is retryable.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds to wait before retrying the preservation mutation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PreservationLocked:
      description: |
        One or more active preservation locks block the destructive operation
        (409). The canonical error envelope uses code `preservation_locked` and
        omits lock identifiers; identifiers are retained only in audit evidence.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NamespaceDeleteConflict:
      description: |
        Deletion is blocked by active preservation, a retryable lifecycle
        conflict, or one or more direct branch roots (409). A live-branch
        conflict adds only disclosure-filtered `visible_children` and
        `has_additional_children`; the latter is true for denied or truncated
        children, and the response never returns an exact child count.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/NamespaceHasLiveBranchesErrorResponse"
              - $ref: "#/components/schemas/NamespaceDeleteGenericConflictErrorResponse"
    PreservationStateUnavailable:
      description: |
        The S3-authoritative preservation head could not be confirmed within
        the bounded freshness interval (503). The canonical error envelope uses
        code `preservation_state_unavailable`; destructive work fails closed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuditUnavailable:
      description: |
        Required durable audit or destruction evidence could not be committed
        (500). The canonical error envelope uses code `audit_unavailable`; the
        protected mutation is not reported as successful.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Validation error (400)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: Resource not found (404)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NamespaceDeletingError:
      description: Namespace is being deleted (410)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    GoneError:
      description: Namespace is deleting or requested point-in-time is no longer retained (410)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    HydrationDisabled:
      description: Hydration is disabled by configuration (409)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NamespaceAlreadyExistsError:
      description: Namespace already exists with different immutable configuration (409)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SnapshotAlreadyExistsError:
      description: Snapshot name already pins a different generation (409)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictRetry:
      description: |
        Retryable write conflict (409), such as an active namespace lease.
        Canonical error envelope with code `CONFLICT_RETRY`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: |
        Request body exceeds the configured byte limit, or a logical request
        batch exceeds its configured item cap (413). Canonical error envelope
        with code `PAYLOAD_TOO_LARGE`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotImplemented:
      description: |
        Recognized request contract reserved for a later implementation (501).
        Canonical error envelope with code `NOT_IMPLEMENTED`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limit exceeded (429)
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: |
        Missing or non-JSON Content-Type header (415), for endpoints that use
        the JSON extractor. Plain-text body.
      content:
        text/plain:
          schema:
            type: string
            example: "Expected request with `Content-Type: application/json`"
    UnprocessableEntity:
      description: |
        Body is valid JSON but fails strict handler deserialization (422), for
        example because a required field is missing or an unknown field is
        present. Plain-text body. NOTE: the vectors upsert/delete and query
        endpoints instead return 400 with the canonical error envelope (code
        VALIDATION_ERROR) for malformed bodies.
      content:
        text/plain:
          schema:
            type: string
            example: "Failed to deserialize the JSON body into the target type: missing field `dimensions`"

  schemas:
    ForkNamespaceRequest:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target: { type: string }

    ForkNamespaceResponse:
      type: object
      required: [branch_id, created, target]
      properties:
        branch_id: { type: string }
        created: { type: boolean }
        target: { type: string }

    BranchListResponse:
      type: object
      required: [branches]
      properties:
        branches:
          type: array
          items: { $ref: "#/components/schemas/BranchDescriptor" }

    BranchDescriptor:
      type: object
      required: [branch_id, target, mode, depth, lifecycle, health, materialized, created_at]
      properties:
        branch_id: { type: string }
        target:
          type: object
          required: [namespace, incarnation]
          properties:
            namespace: { type: string }
            incarnation: { type: string }
        mode: { type: string, enum: [copy_on_write] }
        depth: { type: integer, minimum: 1 }
        lifecycle: { type: string, enum: [preparing, active, deleting] }
        health: { type: string, enum: [awaiting_authenticated_retry, ready, deletion_in_progress] }
        materialized: { type: boolean }
        created_at: { type: string, format: date-time }

    ErrorResponse:
      type: object
      required: [code, error, status, retryable]
      properties:
        code:
          type: string
          description: |
            Stable, machine-readable error code. Clients should branch on this,
            never on `error` (human text) or `status` alone. Every code is
            enumerated below and is guaranteed stable across releases.
          enum:
            - unauthenticated
            - credential_unknown
            - credential_expired
            - forbidden
            - namespace_not_granted
            - security_stale
            - obligation_unsatisfied
            - constraint_violation
            - cursor_policy_stale
            - invalid_namespace
            - invalid_snapshot
            - invalid_security_request
            - security_conflict
            - security_entity_exists
            - security_entity_not_found
            - audit_unavailable
            - preservation_locked
            - preservation_state_unavailable
            - invalid_preservation_request
            - preservation_lock_not_found
            - preservation_conflict
            - unmapped_route
            - security_internal
            - VALIDATION_ERROR
            - DIMENSION_MISMATCH
            - NAMESPACE_NOT_FOUND
            - NAMESPACE_ALREADY_EXISTS
            - SNAPSHOT_ALREADY_EXISTS
            - SNAPSHOT_NOT_FOUND
            - NAMESPACE_DELETING
            - POINT_IN_TIME_NOT_RETAINED
            - HYDRATION_DISABLED
            - FTS_FIELD_NOT_CONFIGURED
            - CONFLICT_RETRY
            - RATE_LIMITED
            - CONCURRENCY_LIMIT
            - INDEX_UNAVAILABLE
            - REQUEST_TIMEOUT
            - PAYLOAD_TOO_LARGE
            - NOT_IMPLEMENTED
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - INTERNAL_DATA_MISSING
            - DATA_CORRUPTION
            - STORAGE_ERROR
            - INTERNAL_ERROR
            - namespace_has_live_branches
            - branch_has_live_children
            - branch_integrity_error
        error:
          type: string
          description: Human-readable, client-safe message. Never contains internal S3 keys, endpoints, or tokens.
        status:
          type: integer
          description: HTTP status code
        retryable:
          type: boolean
          description: |
            Whether retrying the identical request may succeed. True for
            conflicts (CONFLICT_RETRY), rate limits, concurrency, timeouts, and
            transient storage errors; responses with `retryable: true` at 409/
            429/503/408 also carry a `Retry-After` header.
        request_id:
          type: string
          description: |
            Echo of the request's `x-request-id` (or a server-generated UUID).
            Present on routes that carry request-id middleware, including the
            lightweight query hot path. Use it to correlate with server logs.
      example:
        code: NAMESPACE_NOT_FOUND
        error: "namespace not found: test"
        status: 404
        retryable: false
        request_id: "b3f1c2e4-..."

    VisibleBranchChild:
      type: object
      additionalProperties: false
      required: [namespace, branch_id]
      properties:
        namespace:
          type: string
          description: Direct child target authorized for current NamespaceRead.
        branch_id:
          type: string
          description: Stable direct-edge identifier for that visible child.

    NamespaceHasLiveBranchesErrorResponse:
      type: object
      additionalProperties: false
      required: [code, error, status, retryable, visible_children, has_additional_children]
      properties:
        code:
          type: string
          enum: [namespace_has_live_branches, branch_has_live_children]
        error:
          type: string
          description: Generic client-safe conflict text with no denied child identity.
        status:
          type: integer
          const: 409
        retryable:
          type: boolean
          const: false
        request_id:
          type: string
        visible_children:
          type: array
          maxItems: 4096
          description: Bounded, deterministic target/branch pairs the caller may read.
          items:
            $ref: "#/components/schemas/VisibleBranchChild"
        has_additional_children:
          type: boolean
          description: True when denied or truncated children also block deletion; never an exact total.

    NamespaceDeleteGenericConflictErrorResponse:
      type: object
      additionalProperties: false
      required: [code, error, status, retryable]
      properties:
        code:
          type: string
          enum: [preservation_locked, CONFLICT_RETRY]
        error:
          type: string
        status:
          type: integer
          const: 409
        retryable:
          type: boolean
        request_id:
          type: string

    SecurityPrincipalId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9._:-]+$"
      description: Stable principal identifier.

    SecurityKeyId:
      type: string
      minLength: 6
      maxLength: 128
      pattern: "^zpk1_[A-Za-z0-9_-]+$"
      description: Public credential identifier without its secret suffix.

    SecurityApiKey:
      type: string
      pattern: "^zpk1_[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"
      description: |
        Complete bearer credential. This value is secret and appears only in a
        successful create-key or rotate-key response.
      x-zeppelin-secret-once: true

    SecurityPrincipalKind:
      type: string
      enum: [human, service, agent, internal, anonymous]

    SecurityPrincipal:
      type: object
      additionalProperties: false
      required: [principal_id, kind, display_name]
      properties:
        principal_id:
          $ref: "#/components/schemas/SecurityPrincipalId"
        kind:
          $ref: "#/components/schemas/SecurityPrincipalKind"
        display_name:
          type: string
          minLength: 1

    CreateSecurityPrincipalRequest:
      type: object
      additionalProperties: false
      required: [principal_id, kind, display_name]
      properties:
        principal_id:
          $ref: "#/components/schemas/SecurityPrincipalId"
        kind:
          $ref: "#/components/schemas/SecurityPrincipalKind"
        display_name:
          type: string
          minLength: 1

    CreateSecurityPrincipalResponse:
      type: object
      additionalProperties: false
      required: [policy_version, principal]
      properties:
        policy_version:
          type: integer
          format: uint64
          minimum: 1
        principal:
          $ref: "#/components/schemas/SecurityPrincipal"

    ListSecurityPrincipalsResponse:
      type: object
      additionalProperties: false
      required: [policy_version, principals]
      properties:
        policy_version:
          type: integer
          format: uint64
          minimum: 1
        principals:
          type: array
          items:
            $ref: "#/components/schemas/SecurityPrincipal"

    CreateSecurityKeyRequest:
      type: object
      additionalProperties: false
      required: [principal_id, name]
      properties:
        principal_id:
          $ref: "#/components/schemas/SecurityPrincipalId"
        name:
          type: string
          minLength: 1
        expires_at:
          type: [string, "null"]
          format: date-time
          default: null

    IssueSecurityKeyResponse:
      type: object
      additionalProperties: false
      required: [policy_version, key_id, api_key]
      properties:
        policy_version:
          type: integer
          format: uint64
          minimum: 1
        key_id:
          $ref: "#/components/schemas/SecurityKeyId"
        api_key:
          $ref: "#/components/schemas/SecurityApiKey"

    RotateSecurityKeyRequest:
      type: object
      additionalProperties: false
      properties:
        overlap_secs:
          type: integer
          format: uint64
          minimum: 0
          default: 0

    RotateSecurityKeyResponse:
      type: object
      additionalProperties: false
      required: [policy_version, key_id, api_key, rotated_from]
      properties:
        policy_version:
          type: integer
          format: uint64
          minimum: 1
        key_id:
          $ref: "#/components/schemas/SecurityKeyId"
        api_key:
          $ref: "#/components/schemas/SecurityApiKey"
        rotated_from:
          $ref: "#/components/schemas/SecurityKeyId"

    RevokeSecurityKeyResponse:
      type: object
      additionalProperties: false
      required: [policy_version, key_id]
      properties:
        policy_version:
          type: integer
          format: uint64
          minimum: 1
        key_id:
          $ref: "#/components/schemas/SecurityKeyId"

    SecurityKeyState:
      type: string
      enum: [active, revoked, expired]

    SecurityKeyView:
      type: object
      additionalProperties: false
      description: Redacted lifecycle metadata; digest and plaintext secret are intentionally absent.
      required:
        - key_id
        - name
        - principal_id
        - state
        - expires_at
        - created_at
        - rotated_from
        - revokes_at
      properties:
        key_id:
          $ref: "#/components/schemas/SecurityKeyId"
        name:
          type: string
          minLength: 1
        principal_id:
          $ref: "#/components/schemas/SecurityPrincipalId"
        state:
          $ref: "#/components/schemas/SecurityKeyState"
        expires_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        rotated_from:
          oneOf:
            - $ref: "#/components/schemas/SecurityKeyId"
            - type: "null"
        revokes_at:
          type: [string, "null"]
          format: date-time

    ListSecurityKeysResponse:
      type: object
      additionalProperties: false
      required: [policy_version, keys]
      properties:
        policy_version:
          type: integer
          format: uint64
          minimum: 1
        keys:
          type: array
          items:
            $ref: "#/components/schemas/SecurityKeyView"

    SecurityAction:
      type: string
      enum:
        - SystemRead
        - MetricsRead
        - RuntimeConfigRead
        - RuntimeConfigWrite
        - NamespaceCreate
        - NamespaceRead
        - NamespaceDelete
        - SnapshotRead
        - SnapshotWrite
        - SnapshotDelete
        - NamespaceClone
        - NamespaceFork
        - IndexConfigWrite
        - CompactionTrigger
        - CompactionStatusRead
        - HydrationTrigger
        - VectorFetch
        - VectorUpsert
        - VectorDelete
        - Query
        - SecurityAdminRead
        - SecurityAdminWrite
        - AttributeAdmin
        - CredentialDelegate
        - PreservationAdmin
        - PreservationRelease

    DelegatedSecurityAction:
      type: string
      description: Namespace-bound action representable by a Phase 7 delegated token.
      enum:
        - NamespaceRead
        - NamespaceDelete
        - SnapshotRead
        - SnapshotWrite
        - SnapshotDelete
        - NamespaceFork
        - IndexConfigWrite
        - CompactionTrigger
        - CompactionStatusRead
        - HydrationTrigger
        - VectorFetch
        - VectorUpsert
        - VectorDelete
        - Query
        - AttributeAdmin

    SecurityGrantScope:
      oneOf:
        - $ref: "#/components/schemas/SecurityGlobalGrantScope"
        - $ref: "#/components/schemas/SecurityNamespaceGrantScope"
      discriminator:
        propertyName: kind
        mapping:
          global: "#/components/schemas/SecurityGlobalGrantScope"
          namespace: "#/components/schemas/SecurityNamespaceGrantScope"

    SecurityGlobalGrantScope:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          const: global

    SecurityNamespaceGrantScope:
      type: object
      additionalProperties: false
      required: [kind, namespace]
      properties:
        kind:
          const: namespace
        namespace:
          type: string
          minLength: 1
          maxLength: 255

    SecurityGrantActions:
      oneOf:
        - $ref: "#/components/schemas/SecurityAllGrantActions"
        - $ref: "#/components/schemas/SecuritySelectedGrantActions"
      discriminator:
        propertyName: kind
        mapping:
          all: "#/components/schemas/SecurityAllGrantActions"
          selected: "#/components/schemas/SecuritySelectedGrantActions"

    SecurityAllGrantActions:
      type: object
      description: |
        Grants the frozen baseline action inventory. AttributeAdmin,
        CredentialDelegate, NamespaceFork, PreservationAdmin,
        PreservationRelease, and SecurityAdminWrite are excluded and must
        always be named explicitly in a selected action grant.
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          const: all

    SecuritySelectedGrantActions:
      type: object
      additionalProperties: false
      required: [kind, actions]
      properties:
        kind:
          const: selected
        actions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SecurityAction"

    SecurityGrant:
      type: object
      description: |
        One authorization grant and its optional server-owned constraints.
        Multiple applicable grants all participate: filters are ANDed, mask
        deny sets are unioned, and compatible write constraints are merged.
      additionalProperties: false
      required: [principal_id, scope, actions]
      properties:
        principal_id:
          $ref: "#/components/schemas/SecurityPrincipalId"
        scope:
          $ref: "#/components/schemas/SecurityGrantScope"
        actions:
          $ref: "#/components/schemas/SecurityGrantActions"
        mandatory_filter:
          $ref: "#/components/schemas/SecurityPolicyFilter"
        field_mask:
          $ref: "#/components/schemas/SecurityFieldMask"
        write_constraints:
          $ref: "#/components/schemas/SecurityWriteConstraints"
        require_approval:
          $ref: "#/components/schemas/SecurityApprovalActions"

    SecurityGrantMutationRequest:
      type: object
      description: |
        Publishes one exact grant binding. `mandatory_filter` is enforced in
        addition to any caller filter. `field_mask` removes denied attributes
        from response payloads and rejects caller filters, BM25 ranking,
        facets, or grouping that reference them, preventing value inference.
        `write_constraints.stamp` overwrites caller values on every upsert,
        while `forbid_set` rejects the whole batch when a protected field is
        supplied. AttributeAdmin bypasses `forbid_set` only; server stamps
        remain authoritative.
      additionalProperties: false
      required: [principal_id, scope, actions]
      properties:
        principal_id:
          $ref: "#/components/schemas/SecurityPrincipalId"
        scope:
          $ref: "#/components/schemas/SecurityGrantScope"
        actions:
          $ref: "#/components/schemas/SecurityGrantActions"
        mandatory_filter:
          $ref: "#/components/schemas/SecurityPolicyFilter"
        field_mask:
          $ref: "#/components/schemas/SecurityFieldMask"
        write_constraints:
          $ref: "#/components/schemas/SecurityWriteConstraints"
        require_approval:
          $ref: "#/components/schemas/SecurityApprovalActions"

    SecurityApprovalActions:
      type: array
      description: |
        Destructive actions in this same grant that require a distinct
        authorized zpk1 approver through X-Zeppelin-Approval.
      minItems: 1
      uniqueItems: true
      items:
        type: string
        enum: [NamespaceDelete, SnapshotDelete, VectorDelete, SecurityAdminWrite, PreservationRelease]

    SecurityGrantRemovalRequest:
      type: object
      additionalProperties: false
      required: [principal_id, scope, actions]
      properties:
        principal_id:
          $ref: "#/components/schemas/SecurityPrincipalId"
        scope:
          $ref: "#/components/schemas/SecurityGrantScope"
        actions:
          $ref: "#/components/schemas/SecurityGrantActions"

    SecurityFieldMask:
      type: object
      description: |
        Attribute fields omitted, rather than serialized as null, from query,
        batch, fetch, grouped, and explain result payloads. A denied field also
        cannot be referenced by caller filters or ranking expressions or
        selected as a facet/grouping output field, because membership, ordering,
        and counts would otherwise become value oracles. Such query requests
        fail 403 `constraint_violation` before retrieval.
      additionalProperties: false
      required: [deny]
      properties:
        deny:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: "\\S"

    SecurityWriteConstraints:
      type: object
      description: |
        Server-owned upsert controls. Stamps overwrite caller values. Supplying
        any `forbid_set` field rejects the complete batch before WAL publication,
        unless the principal also has AttributeAdmin; stamps still apply for an
        AttributeAdmin principal.
      additionalProperties: false
      anyOf:
        - required: [stamp]
          properties:
            stamp:
              minProperties: 1
        - required: [forbid_set]
          properties:
            forbid_set:
              minItems: 1
      properties:
        stamp:
          type: object
          propertyNames:
            pattern: "\\S"
          additionalProperties:
            $ref: "#/components/schemas/AttributeValue"
        forbid_set:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: "\\S"

    SecurityGrantMutationResponse:
      type: object
      additionalProperties: false
      required: [policy_version, grant]
      properties:
        policy_version:
          type: integer
          format: uint64
          minimum: 1
        grant:
          $ref: "#/components/schemas/SecurityGrant"

    ListSecurityGrantsResponse:
      type: object
      additionalProperties: false
      required: [policy_version, grants]
      properties:
        policy_version:
          type: integer
          format: uint64
          minimum: 1
        grants:
          type: array
          items:
            $ref: "#/components/schemas/SecurityGrant"

    MintDelegatedTokenRequest:
      type: object
      additionalProperties: false
      required: [actions, namespaces, purpose, expires_in_secs]
      properties:
        actions:
          type: array
          minItems: 1
          maxItems: 14
          uniqueItems: true
          description: Explicit namespace-bound signed action ceiling.
          items:
            $ref: "#/components/schemas/DelegatedSecurityAction"
        namespaces:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 255
        mandatory_filter:
          $ref: "#/components/schemas/SecurityPolicyFilter"
        purpose:
          type: string
          minLength: 1
          maxLength: 512
          pattern: ".*\\S.*"
          description: Mandatory redaction-safe operator purpose recorded in audit.
        expires_in_secs:
          type: integer
          format: uint64
          minimum: 1
          description: Requested lifetime, bounded by security.delegated_token_max_ttl_secs.

    MintDelegatedTokenResponse:
      type: object
      additionalProperties: false
      required: [policy_version, token_id, token, expires_at]
      properties:
        policy_version:
          type: integer
          format: uint64
          minimum: 1
        token_id:
          type: string
          pattern: "^zdt1_[0-9A-HJKMNP-TV-Z]{26}$"
        token:
          type: string
          pattern: "^zpt1_[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"
          description: One-time bearer secret; never returned by a later read.
        expires_at:
          type: string
          format: date-time

    PreservationLockId:
      type: string
      pattern: "^plk_[0-9A-HJKMNP-TV-Z]{26}$"

    PreservationScope:
      oneOf:
        - $ref: "#/components/schemas/PreservationGlobalScope"
        - $ref: "#/components/schemas/PreservationNamespaceScope"
        - $ref: "#/components/schemas/PreservationNamespaceFilterScope"
      discriminator:
        propertyName: kind
        mapping:
          global: "#/components/schemas/PreservationGlobalScope"
          namespace: "#/components/schemas/PreservationNamespaceScope"
          namespace_filter: "#/components/schemas/PreservationNamespaceFilterScope"

    PreservationGlobalScope:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          const: global

    PreservationNamespaceScope:
      type: object
      additionalProperties: false
      required: [kind, namespace]
      properties:
        kind:
          const: namespace
        namespace:
          type: string
          minLength: 1
          maxLength: 255

    PreservationNamespaceFilterScope:
      type: object
      additionalProperties: false
      required: [kind, namespace, filter]
      properties:
        kind:
          const: namespace_filter
        namespace:
          type: string
          minLength: 1
          maxLength: 255
        filter:
          $ref: "#/components/schemas/SecurityPolicyFilter"

    PreservationReasonKind:
      type: string
      enum: [litigation, regulatory, investigation, customer_freeze, other]

    PreservationState:
      type: string
      enum: [active, released]

    CreatePreservationLockRequest:
      type: object
      additionalProperties: false
      required: [scope, reason_kind, reason_text]
      properties:
        scope:
          $ref: "#/components/schemas/PreservationScope"
        reason_kind:
          $ref: "#/components/schemas/PreservationReasonKind"
        reason_text:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: ".*\\S.*"

    PreservationLockRecord:
      type: object
      additionalProperties: false
      required: [lock_id, scope, reason_kind, reason_text, created_by, created_at, state]
      properties:
        lock_id:
          $ref: "#/components/schemas/PreservationLockId"
        scope:
          $ref: "#/components/schemas/PreservationScope"
        reason_kind:
          $ref: "#/components/schemas/PreservationReasonKind"
        reason_text:
          type: string
          minLength: 1
          maxLength: 4096
        created_by:
          $ref: "#/components/schemas/SecurityPrincipalId"
        created_at:
          type: string
          format: date-time
        released_by:
          $ref: "#/components/schemas/SecurityPrincipalId"
        released_at:
          type: string
          format: date-time
        state:
          $ref: "#/components/schemas/PreservationState"

    ListPreservationLocksResponse:
      type: object
      additionalProperties: false
      required: [locks]
      properties:
        locks:
          type: array
          items:
            $ref: "#/components/schemas/PreservationLockRecord"

    SecurityPolicyMetadataResponse:
      type: object
      additionalProperties: false
      required:
        - policy_version
        - object_key
        - checksum
        - created_at
        - created_by
        - principals
        - keys
        - grants
      properties:
        policy_version:
          type: integer
          format: uint64
          minimum: 1
        object_key:
          type: string
          description: Exact immutable S3 policy object key selected by the active head.
        checksum:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Canonical SHA-256 checksum of the active snapshot.
        created_at:
          type: string
          format: date-time
        created_by:
          $ref: "#/components/schemas/SecurityPrincipalId"
        principals:
          type: integer
          format: uint64
          minimum: 0
        keys:
          type: integer
          format: uint64
          minimum: 0
        grants:
          type: integer
          format: uint64
          minimum: 0

    DistanceMetric:
      type: string
      enum: [cosine, euclidean, dot_product]
      default: cosine

    CostLatencyProfile:
      type: string
      enum: [low_cost, balanced, low_latency]
      default: balanced
      description: Preset that resolves to an effective rerank coalesce gap.

    QueryKnobs:
      type: object
      required:
        - rerank_coalesce_gap_bytes
        - default_nprobe
        - default_top_k
        - bm25_max_full_scan_clusters
        - bm25_max_full_scan_vectors
      properties:
        rerank_coalesce_gap_bytes:
          type: integer
          minimum: 0
          description: Maximum byte gap merged between rerank f32 ranges.
        default_nprobe:
          type: integer
          minimum: 1
          description: |
            Runtime floor for an omitted nprobe. Flat segments probe the
            greater of this floor and 3/16 of their actual cluster count;
            hierarchical queries use the floor directly.
        default_top_k:
          type: integer
          minimum: 1
          description: Default result count when a query omits top_k.
        bm25_max_full_scan_clusters:
          type: integer
          minimum: 0
          description: BM25 full-scan cluster breaker; 0 disables it.
        bm25_max_full_scan_vectors:
          type: integer
          minimum: 0
          description: BM25 full-scan vector breaker; 0 disables it.

    QueryKnobsPatch:
      type: object
      additionalProperties: false
      description: |
        Partial runtime query config update. Omitted fields are left unchanged.
        `rerank_coalesce_gap_bytes` and `cost_latency_profile` cannot appear
        together.
      properties:
        rerank_coalesce_gap_bytes:
          type: integer
          minimum: 0
          description: Explicit rerank coalesce gap in bytes.
        cost_latency_profile:
          $ref: "#/components/schemas/CostLatencyProfile"
        default_nprobe:
          type: integer
          minimum: 1
          description: |
            Runtime floor for an omitted nprobe. Flat segments may resolve
            above it from their actual cluster count.
        default_top_k:
          type: integer
          minimum: 1
          description: Default result count when a query omits top_k.
        bm25_max_full_scan_clusters:
          type: integer
          minimum: 0
          description: BM25 full-scan cluster breaker; 0 disables it.
        bm25_max_full_scan_vectors:
          type: integer
          minimum: 0
          description: BM25 full-scan vector breaker; 0 disables it.

    QuantizationType:
      type: string
      enum: [none, scalar, two_bit, product]
      description: Quantization mode recorded on the active segment.

    NamespaceIndexConfig:
      type: object
      required: [nlist, quantization, pq_m, hierarchical, fts_index, bitmap_index]
      properties:
        nlist:
          type: integer
          minimum: 1
          description: Number of IVF centroids/clusters used by future compactions.
        quantization:
          $ref: "#/components/schemas/QuantizationType"
        pq_m:
          type: integer
          minimum: 1
          description: Product-quantization subquantizers; must divide namespace dimensions when quantization is `product`.
        hierarchical:
          type: boolean
          description: Whether future compactions build a hierarchical index.
        fts_index:
          type: boolean
          description: Whether future compactions build segment FTS indexes.
        bitmap_index:
          type: boolean
          description: Whether future compactions build bitmap prefilter indexes.

    CreateNamespaceIndexConfig:
      type: object
      properties:
        nlist:
          type: integer
          minimum: 1
        quantization:
          $ref: "#/components/schemas/QuantizationType"
        pq_m:
          type: integer
          minimum: 1
        hierarchical:
          type: boolean
        fts_index:
          type: boolean
        bitmap_index:
          type: boolean
      description: Partial per-namespace index config overlay.

    PatchNamespaceIndexConfigRequest:
      allOf:
        - $ref: "#/components/schemas/CreateNamespaceIndexConfig"
      minProperties: 1
      description: Partial per-namespace index config update; at least one field is required.

    IndexKind:
      type: string
      enum: [ivf_flat, ivf_sq, ivf_pq, hierarchical]
      description: Index kind used by the namespace's active segment.

    ConsistencyLevel:
      type: string
      description: |
        `strong` scans un-compacted WAL fragments and indexed segments.
        `eventual` skips WAL vector/BM25 scoring for fresher upserts and updates,
        but still applies WAL delete tombstones so deleted vectors do not appear
        after a successful delete on the same node.
      enum: [strong, eventual]
      default: strong

    FtsLanguage:
      type: string
      enum: [english]
      default: english

    AttributeValue:
      description: |
        A scalar or array attribute value. One of:
        - string
        - integer (int64)
        - number (float64)
        - boolean
        - array of strings
        - array of integers
        - array of numbers
      anyOf:
        - type: string
        - type: integer
          format: int64
        - type: number
          format: double
        - type: boolean
        - type: array
          items:
            type: string
        - type: array
          items:
            type: integer
            format: int64
        - type: array
          items:
            type: number
            format: double

    FtsFieldConfig:
      type: object
      description: Per-field configuration for full-text search.
      properties:
        language:
          $ref: "#/components/schemas/FtsLanguage"
        stemming:
          type: boolean
          default: true
          description: Whether to apply stemming (e.g., "running" -> "run").
        remove_stopwords:
          type: boolean
          default: true
          description: Whether to remove common stopwords.
        case_sensitive:
          type: boolean
          default: false
          description: Whether matching is case-sensitive.
        k1:
          type: number
          format: float
          default: 1.2
          description: "BM25 k1 parameter: term frequency saturation."
        b:
          type: number
          format: float
          default: 0.75
          description: "BM25 b parameter: length normalization."
        max_token_length:
          type: integer
          default: 40
          description: Maximum token length; tokens exceeding this are discarded.

    Filter:
      type: object
      required: [op]
      description: |
        Filter condition discriminated by the `op` field. Supported operators:
        - `eq`: Exact match on a field
        - `not_eq`: Not equal
        - `range`: Numeric range (gte, lte, gt, lt)
        - `in`: Field value is one of the given values
        - `not_in`: Field value is not one of the given values
        - `contains`: Array field contains the given value
        - `contains_all_tokens`: All tokens must be present (order-independent)
        - `contains_token_sequence`: Tokens must appear as exact phrase
        - `and`: All sub-filters must match
        - `or`: Any sub-filter must match
        - `not`: Negate a sub-filter
      discriminator:
        propertyName: op
        mapping:
          eq: "#/components/schemas/FilterEq"
          not_eq: "#/components/schemas/FilterNotEq"
          range: "#/components/schemas/FilterRange"
          in: "#/components/schemas/FilterIn"
          not_in: "#/components/schemas/FilterNotIn"
          contains: "#/components/schemas/FilterContains"
          contains_all_tokens: "#/components/schemas/FilterContainsAllTokens"
          contains_token_sequence: "#/components/schemas/FilterContainsTokenSequence"
          and: "#/components/schemas/FilterAnd"
          or: "#/components/schemas/FilterOr"
          not: "#/components/schemas/FilterNot"
      oneOf:
        - $ref: "#/components/schemas/FilterEq"
        - $ref: "#/components/schemas/FilterNotEq"
        - $ref: "#/components/schemas/FilterRange"
        - $ref: "#/components/schemas/FilterIn"
        - $ref: "#/components/schemas/FilterNotIn"
        - $ref: "#/components/schemas/FilterContains"
        - $ref: "#/components/schemas/FilterContainsAllTokens"
        - $ref: "#/components/schemas/FilterContainsTokenSequence"
        - $ref: "#/components/schemas/FilterAnd"
        - $ref: "#/components/schemas/FilterOr"
        - $ref: "#/components/schemas/FilterNot"

    FilterEq:
      type: object
      additionalProperties: false
      required: [op, field, value]
      properties:
        op:
          type: string
          const: eq
        field:
          type: string
        value:
          $ref: "#/components/schemas/AttributeValue"

    FilterNotEq:
      type: object
      additionalProperties: false
      required: [op, field, value]
      properties:
        op:
          type: string
          const: not_eq
        field:
          type: string
        value:
          $ref: "#/components/schemas/AttributeValue"

    FilterRange:
      type: object
      additionalProperties: false
      required: [op, field]
      properties:
        op:
          type: string
          const: range
        field:
          type: string
        gte:
          type: number
        lte:
          type: number
        gt:
          type: number
        lt:
          type: number

    FilterIn:
      type: object
      additionalProperties: false
      required: [op, field, values]
      properties:
        op:
          type: string
          const: in
        field:
          type: string
        values:
          type: array
          items:
            $ref: "#/components/schemas/AttributeValue"

    FilterNotIn:
      type: object
      additionalProperties: false
      required: [op, field, values]
      properties:
        op:
          type: string
          const: not_in
        field:
          type: string
        values:
          type: array
          items:
            $ref: "#/components/schemas/AttributeValue"

    FilterContains:
      type: object
      additionalProperties: false
      required: [op, field, value]
      properties:
        op:
          type: string
          const: contains
        field:
          type: string
        value:
          $ref: "#/components/schemas/AttributeValue"

    FilterContainsAllTokens:
      type: object
      additionalProperties: false
      required: [op, field, tokens]
      properties:
        op:
          type: string
          const: contains_all_tokens
        field:
          type: string
        tokens:
          type: array
          items:
            type: string

    FilterContainsTokenSequence:
      type: object
      additionalProperties: false
      required: [op, field, tokens]
      properties:
        op:
          type: string
          const: contains_token_sequence
        field:
          type: string
        tokens:
          type: array
          items:
            type: string

    FilterAnd:
      type: object
      additionalProperties: false
      required: [op, filters]
      properties:
        op:
          type: string
          const: and
        filters:
          type: array
          items:
            $ref: "#/components/schemas/Filter"

    FilterOr:
      type: object
      additionalProperties: false
      required: [op, filters]
      properties:
        op:
          type: string
          const: or
        filters:
          type: array
          items:
            $ref: "#/components/schemas/Filter"

    FilterNot:
      type: object
      additionalProperties: false
      required: [op, filter]
      properties:
        op:
          type: string
          const: not
        filter:
          $ref: "#/components/schemas/Filter"

    SecurityPolicyFilter:
      description: |
        The existing Filter wire AST with publication-time fail-closed
        restrictions for server-owned policy predicates: field names contain a
        non-whitespace character, ranges contain a bound, and membership,
        token, and logical lists are nonempty. Every token entry must also
        produce at least one analyzed token under the default production
        tokenizer.
      discriminator:
        propertyName: op
        mapping:
          eq: "#/components/schemas/SecurityPolicyFilterEq"
          not_eq: "#/components/schemas/SecurityPolicyFilterNotEq"
          range: "#/components/schemas/SecurityPolicyFilterRange"
          in: "#/components/schemas/SecurityPolicyFilterIn"
          not_in: "#/components/schemas/SecurityPolicyFilterNotIn"
          contains: "#/components/schemas/SecurityPolicyFilterContains"
          contains_all_tokens: "#/components/schemas/SecurityPolicyFilterContainsAllTokens"
          contains_token_sequence: "#/components/schemas/SecurityPolicyFilterContainsTokenSequence"
          and: "#/components/schemas/SecurityPolicyFilterAnd"
          or: "#/components/schemas/SecurityPolicyFilterOr"
          not: "#/components/schemas/SecurityPolicyFilterNot"
      oneOf:
        - $ref: "#/components/schemas/SecurityPolicyFilterEq"
        - $ref: "#/components/schemas/SecurityPolicyFilterNotEq"
        - $ref: "#/components/schemas/SecurityPolicyFilterRange"
        - $ref: "#/components/schemas/SecurityPolicyFilterIn"
        - $ref: "#/components/schemas/SecurityPolicyFilterNotIn"
        - $ref: "#/components/schemas/SecurityPolicyFilterContains"
        - $ref: "#/components/schemas/SecurityPolicyFilterContainsAllTokens"
        - $ref: "#/components/schemas/SecurityPolicyFilterContainsTokenSequence"
        - $ref: "#/components/schemas/SecurityPolicyFilterAnd"
        - $ref: "#/components/schemas/SecurityPolicyFilterOr"
        - $ref: "#/components/schemas/SecurityPolicyFilterNot"

    SecurityPolicyFilterEq:
      allOf:
        - $ref: "#/components/schemas/FilterEq"
        - properties:
            field:
              type: string
              pattern: "\\S"

    SecurityPolicyFilterNotEq:
      allOf:
        - $ref: "#/components/schemas/FilterNotEq"
        - properties:
            field:
              type: string
              pattern: "\\S"

    SecurityPolicyFilterRange:
      allOf:
        - $ref: "#/components/schemas/FilterRange"
        - properties:
            field:
              type: string
              pattern: "\\S"
          anyOf:
            - required: [gte]
            - required: [lte]
            - required: [gt]
            - required: [lt]

    SecurityPolicyFilterIn:
      allOf:
        - $ref: "#/components/schemas/FilterIn"
        - properties:
            field:
              type: string
              pattern: "\\S"
            values:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/AttributeValue"

    SecurityPolicyFilterNotIn:
      allOf:
        - $ref: "#/components/schemas/FilterNotIn"
        - properties:
            field:
              type: string
              pattern: "\\S"
            values:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/AttributeValue"

    SecurityPolicyFilterContains:
      allOf:
        - $ref: "#/components/schemas/FilterContains"
        - properties:
            field:
              type: string
              pattern: "\\S"

    SecurityPolicyFilterContainsAllTokens:
      allOf:
        - $ref: "#/components/schemas/FilterContainsAllTokens"
        - properties:
            field:
              type: string
              pattern: "\\S"
            tokens:
              type: array
              minItems: 1
              description: |
                Every entry must contain a non-whitespace character and produce
                at least one analyzed token under the default production tokenizer.
                Publication rejects whitespace-only, punctuation-only, stopword,
                and overlength entries that analysis would discard.
              items:
                type: string
                pattern: "\\S"

    SecurityPolicyFilterContainsTokenSequence:
      allOf:
        - $ref: "#/components/schemas/FilterContainsTokenSequence"
        - properties:
            field:
              type: string
              pattern: "\\S"
            tokens:
              type: array
              minItems: 1
              description: |
                Every entry must contain a non-whitespace character and produce
                at least one analyzed token under the default production tokenizer.
                Publication rejects whitespace-only, punctuation-only, stopword,
                and overlength entries that analysis would discard.
              items:
                type: string
                pattern: "\\S"

    SecurityPolicyFilterAnd:
      allOf:
        - $ref: "#/components/schemas/FilterAnd"
        - properties:
            filters:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/SecurityPolicyFilter"

    SecurityPolicyFilterOr:
      allOf:
        - $ref: "#/components/schemas/FilterOr"
        - properties:
            filters:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/SecurityPolicyFilter"

    SecurityPolicyFilterNot:
      allOf:
        - $ref: "#/components/schemas/FilterNot"
        - properties:
            filter:
              $ref: "#/components/schemas/SecurityPolicyFilter"

    RankByExpression:
      description: |
        BM25 ranking expression as an S-expression JSON array. Examples:
        - Single field: `["content", "BM25", "search query"]`
        - Multi-field sum: `["Sum", [["title", "BM25", "q"], ["content", "BM25", "q"]]]`
        - Weighted: `["Product", 2.0, ["title", "BM25", "q"]]`
        - Max: `["Max", [["title", "BM25", "q"], ["body", "BM25", "q"]]]`
      type: array
      items: {}
      examples:
        - ["content", "BM25", "search query"]
        - ["Sum", [["title", "BM25", "q"], ["content", "BM25", "q"]]]
        - ["Product", 2.0, ["title", "BM25", "q"]]

    VectorEntry:
      type: object
      required: [id, values]
      properties:
        id:
          type: string
          description: Unique vector identifier
        values:
          type: array
          items:
            type: number
            format: float
          description: Vector embedding values
        attributes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AttributeValue"
          description: Optional key-value metadata for filtering

    SearchResult:
      type: object
      required: [id, score, attributes]
      properties:
        id:
          type: string
          description: Vector identifier
        score:
          type: number
          format: float
          description: Distance (vector search, lower is better) or BM25 relevance score (higher is better)
        attributes:
          type: object
          nullable: true
          additionalProperties:
            $ref: "#/components/schemas/AttributeValue"
          description: Result attributes, or null when include_attributes is false.

    CreateNamespaceRequest:
      type: object
      required: [dimensions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
          description: |
            Optional client-specified namespace name. Must be safe as both an
            S3 top-level key prefix and a single URL path segment: 1-255
            characters, starts with ASCII alphanumeric, and then contains only
            ASCII alphanumeric, dash, underscore, or dot characters. Names are
            validated at creation time and are not coerced.
        dimensions:
          type: integer
          minimum: 1
          maximum: 65536
          description: Vector dimensionality
        distance_metric:
          $ref: "#/components/schemas/DistanceMetric"
        full_text_search:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/FtsFieldConfig"
          description: Per-field FTS configuration. Keys are attribute field names.
        index_config:
          $ref: "#/components/schemas/CreateNamespaceIndexConfig"
          description: Optional per-namespace index config. Missing fields inherit server defaults.

    CreateNamespaceResponse:
      description: Response from namespace creation or idempotent create-by-name.
      allOf:
        - $ref: "#/components/schemas/NamespaceResponse"
        - type: object
          required: [warning]
          properties:
            warning:
              type: string
              description: Creation note. Generated UUID namespaces include a warning to save the name.
              example: "Save this namespace name. It cannot be recovered if lost."

    CloneNamespaceRequest:
      type: object
      required: [target, as_of]
      additionalProperties: false
      properties:
        target:
          type: string
          minLength: 1
          maxLength: 255
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
          description: Fresh target namespace to create.
        as_of:
          type: string
          description: |
            Retained source point-in-time target: manifest generation,
            RFC3339 timestamp, or `snapshot:<name>`.

    CloneNamespaceResponse:
      type: object
      required:
        - source
        - target
        - generation
        - target_generation
        - mode
        - namespace
      properties:
        source:
          type: string
          description: Source namespace read at the requested point in time.
        target:
          type: string
          description: Fresh namespace created by the clone operation.
        generation:
          type: integer
          format: uint64
          description: Source manifest generation that was materialized.
        target_generation:
          type: integer
          format: uint64
          description: Target manifest generation after materialization.
        mode:
          type: string
          enum: [copy]
          description: Clone materialization mode.
        namespace:
          $ref: "#/components/schemas/NamespaceResponse"

    NamespaceResponse:
      type: object
      required:
        - name
        - dimensions
        - distance_metric
        - vector_count
        - uncompacted_fragments
        - segment_count
        - approximate_storage_bytes
        - quantization
        - index_kind
        - index_config
        - active_segment_vector_count
        - last_compaction_at
        - last_compaction_status
        - consecutive_compaction_failures
        - index_degraded
        - created_at
        - updated_at
        - state
      properties:
        name:
          type: string
        dimensions:
          type: integer
        distance_metric:
          $ref: "#/components/schemas/DistanceMetric"
        vector_count:
          type: integer
          format: int64
          description: |
            Manifest-derived live entry count: compacted segment vector counts
            plus uncompacted WAL vector entries minus uncompacted WAL tombstones,
            lower-bounded at zero. Exact for the manifest aggregate; an upper
            bound on unique live vector IDs until compaction resolves duplicate
            upserts by ID.
        uncompacted_fragments:
          type: integer
          description: Number of WAL fragments currently referenced by the manifest.
        segment_count:
          type: integer
          description: Number of segment refs currently tracked by the manifest.
        approximate_storage_bytes:
          type: integer
          format: int64
          description: |
            Approximate live storage bytes known from manifest refs
            (`FragmentRef.size_bytes` and segment artifact size refs). This value
            is derived without object listing or HEAD calls; legacy refs with
            unknown sizes contribute zero for those artifacts.
        quantization:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/QuantizationType"
          description: Active segment quantization mode, or null before first compaction.
        index_kind:
          $ref: "#/components/schemas/IndexKind"
        index_config:
          $ref: "#/components/schemas/NamespaceIndexConfig"
          description: Effective desired index parameters for future compactions.
        active_segment_vector_count:
          type: integer
          description: Vector count in the active segment only, excluding uncompacted WAL.
        last_compaction_at:
          type: string
          format: date-time
          nullable: true
          description: Last recorded compaction completion or failure timestamp.
        last_compaction_status:
          type: string
          enum: [never, success, failure]
          description: Last recorded compaction status.
        last_compaction_error:
          type: string
          description: Last compaction failure message. Omitted unless the last compaction failed.
        consecutive_compaction_failures:
          type: integer
          description: Consecutive compaction failures since the last success.
        index_degraded:
          type: boolean
          description: True after five consecutive compaction failures.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        state:
          type: string
          enum: [active, deleting]
          description: |
            Namespace lifecycle state. `deleting` means deletion has started;
            reads and writes against data endpoints return 410 while cleanup
            completes.
        full_text_search:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/FtsFieldConfig"
          description: Present only when FTS fields are configured.
        branch:
          allOf:
            - $ref: "#/components/schemas/BranchStatusDescriptor"
          nullable: true
          description: Redacted target-local branch status; omitted for ordinary namespaces.

    BranchStatusDescriptor:
      type: object
      required: [branch_id, mode, depth, lifecycle, health, materialized, created_at]
      properties:
        branch_id:
          type: string
        mode:
          $ref: "#/components/schemas/BranchMode"
        depth:
          type: integer
          format: int32
          minimum: 1
        lifecycle:
          $ref: "#/components/schemas/BranchLifecycle"
        health:
          $ref: "#/components/schemas/BranchHealth"
        materialized:
          type: boolean
        created_at:
          type: string
          format: date-time

    DeleteNamespaceResponse:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [deleting]
          description: Namespace deletion has been accepted and cleanup is resumable.

    HydrateNamespaceResponse:
      type: object
      required: [namespace, segment_id]
      properties:
        namespace:
          type: string
          description: Namespace whose active segment was queued.
        segment_id:
          type: string
          description: Active segment id queued into the hydrator pipeline.

    CompactionStatusResponse:
      type: object
      required:
        - namespace
        - manifest_generation
        - uncompacted_fragments
        - segment_count
        - active_segment
        - active_segment_vector_count
        - ready
      properties:
        namespace:
          type: string
        manifest_generation:
          type: integer
          format: uint64
          description: Persisted manifest generation read from object storage.
        uncompacted_fragments:
          type: integer
          minimum: 0
          description: Number of WAL fragments still waiting for compaction.
        segment_count:
          type: integer
          minimum: 0
          description: Number of compacted segment references in the manifest.
        active_segment:
          type: [string, "null"]
          description: Active segment id, or null before first compaction.
        active_segment_vector_count:
          type: integer
          minimum: 0
          description: Vector count in the active segment only.
        ready:
          type: boolean
          description: True when no WAL fragments are waiting for compaction.

    CompactNamespaceResponse:
      allOf:
        - $ref: "#/components/schemas/CompactionStatusResponse"
        - type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [accepted, noop]
              description: Outcome for this manual compaction trigger.

    UpdateIndexConfigResponse:
      type: object
      required: [namespace, index_config, status, observe]
      properties:
        namespace:
          type: string
        index_config:
          $ref: "#/components/schemas/NamespaceIndexConfig"
        status:
          type: string
          const: accepted
        observe:
          type: string
          description: Human-readable observation hint for the asynchronous compaction rewrite.

    SnapshotResponse:
      type: object
      required: [name, generation, created_at]
      properties:
        name:
          type: string
          description: Snapshot name.
        generation:
          type: integer
          format: uint64
          description: Manifest generation pinned by this snapshot.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the snapshot pin was created.

    ListSnapshotsResponse:
      type: object
      required: [snapshots]
      properties:
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/SnapshotResponse"

    UpsertVectorsRequest:
      type: object
      required: [vectors]
      properties:
        vectors:
          type: array
          items:
            $ref: "#/components/schemas/UpsertVectorInput"
          minItems: 1
          maxItems: 50000
          description: |
            Maximum item count is the default `server.max_batch_size`; servers
            may advertise a different configured cap operationally. Batches
            above the cap return 413 and are not partially committed.

    UpsertVectorInput:
      type: object
      required: [values]
      properties:
        id:
          type: string
          description: |
            Caller-visible identity. Required for unconstrained creates. Under
            a mandatory filter, an explicit identity is update-only and must
            already name a visible in-scope row; omit it for a server-owned
            create.
        values:
          type: array
          items:
            type: number
            format: float
          description: Vector embedding values.
        attributes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AttributeValue"
          description: Optional metadata subject to policy stamps and write constraints.

    UpsertVectorsResponse:
      type: object
      required: [upserted]
      properties:
        upserted:
          type: integer
          minimum: 0
          example: 100
        generated_ids:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedVectorId"
          description: |
            Server-owned identities for request rows that omitted `id`, in
            request-index order. Omitted when every row supplied an ID.

    GeneratedVectorId:
      type: object
      required: [index, id]
      properties:
        index:
          type: integer
          minimum: 0
          description: Zero-based position in the submitted vectors array.
        id:
          type: string
          description: Opaque stable identity for later fetch, update, or delete.

    MessagePackUpsertRequest:
      oneOf:
        - $ref: "#/components/schemas/UpsertVectorsRequest"
        - $ref: "#/components/schemas/ColumnarUpsertEnvelope"
      description: |
        MessagePack upsert body. The row form is the same logical schema as
        JSON (`vectors`) and supports server-owned scoped creates by omitting a
        row's `id`. The columnar form carries explicit ids plus one row-major
        little-endian f32 byte buffer, so those ids are update-only under a
        mandatory filter.

    ColumnarUpsertEnvelope:
      type: object
      required: [columnar]
      additionalProperties: false
      properties:
        columnar:
          $ref: "#/components/schemas/ColumnarUpsertRequest"

    ColumnarUpsertRequest:
      type: object
      required: [ids, dimensions, values_f32_le]
      additionalProperties: false
      properties:
        ids:
          type: array
          items:
            type: string
          description: Vector ids in row order.
        dimensions:
          type: integer
          minimum: 1
          description: Number of f32 dimensions per vector.
        values_f32_le:
          type: string
          format: binary
          description: |
            Row-major little-endian f32 bytes. Byte length must equal
            `ids.length * dimensions * 4`.
        attributes:
          type: array
          items:
            anyOf:
              - type: "null"
              - type: object
                additionalProperties:
                  $ref: "#/components/schemas/AttributeValue"
          description: Optional per-vector attributes in row order.

    DeleteVectorsRequest:
      oneOf:
        - $ref: "#/components/schemas/DeleteVectorsByIdsRequest"
        - $ref: "#/components/schemas/DeleteVectorsByFilterRequest"

    DeleteVectorsByIdsRequest:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          items:
            type: string

    DeleteVectorsByFilterRequest:
      type: object
      additionalProperties: false
      required: [filter]
      properties:
        filter:
          $ref: "#/components/schemas/Filter"

    GetVectorsRequest:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
          description: Vector IDs to fetch. Duplicates are rejected.
        include_vector:
          type: boolean
          default: true
          description: Include vector values in found records.
        include_attributes:
          type: boolean
          default: true
          description: Include attributes in found records.
        attribute_fields:
          type: array
          minItems: 1
          items:
            type: string
          description: |
            Optional attribute field allow-list. Valid only when
            `include_attributes=true`; missing fields are omitted.
        consistency:
          $ref: "#/components/schemas/ConsistencyLevel"

    GetVectorsResponse:
      type: object
      required: [results, missing]
      properties:
        results:
          type: array
          description: Found live records in request order.
          items:
            $ref: "#/components/schemas/FetchedVectorRecord"
        missing:
          type: array
          description: |
            Requested IDs that were absent, tombstoned, or outside the current
            principal's mandatory filter. These cases are intentionally
            indistinguishable and preserve request order.
          items:
            type: string

    FetchedVectorRecord:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Vector identifier.
        values:
          type: array
          items:
            type: number
            format: float
          description: Present only when `include_vector=true`.
        attributes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AttributeValue"
          description: Present only when included and non-empty after projection.

    QueryRequest:
      type: object
      additionalProperties: false
      description: |
        Query request contract. Legacy requests continue to provide exactly
        one of `vector` or `rank_by`. Retrieval-algebra requests provide
        `sources` and may include typed `fusion`, `rerank`, `grouping`,
        `facets`, `projection`, `cursor`, and `explain` contracts.

        Implemented today:
        - legacy `vector`
        - legacy `rank_by`
        - single-source `ann` with either raw `vector` or stored seed `id`
        - single-source `bm25`
        - multi-source RRF fusion (`fusion` omitted defaults to RRF k=60)
        - multi-source weighted normalized score fusion
        - explicit vector and BM25 rerank over the candidate frontier
        - opaque cursor pagination
        - field grouping
        - lightweight facet counts over the filtered candidate frontier
        - plan and full query explain output
        - `projection.include_attributes`

        Reserved today (returns code `NOT_IMPLEMENTED`):
        - field/vector projection
      properties:
        vector:
          type: array
          items:
            type: number
            format: float
          description: Query vector for ANN search
        rank_by:
          $ref: "#/components/schemas/RankByExpression"
        last_as_prefix:
          type: boolean
          default: false
          description: Treat the last token of each BM25 query as a prefix (for autocomplete).
        top_k:
          type: integer
          default: 10
          minimum: 1
          maximum: 10000
          description: Number of results to return
        candidate_k:
          type: integer
          minimum: 1
          description: |
            Per-source candidate count before multi-source fusion. Defaults
            to `max(top_k * 4, 100)`. Multi-source fusion, explicit rerank,
            grouping, facets, and cursor pagination use this as the
            first-stage frontier, then truncate to `top_k` after fusion,
            rerank, cursor windowing, or facet counting where applicable.
        filter:
          $ref: "#/components/schemas/Filter"
        consistency:
          $ref: "#/components/schemas/ConsistencyLevel"
        nprobe:
          type: integer
          minimum: 1
          maximum: 256
          description: |
            Number of IVF clusters to probe (vector search only). Values
            above the configured `indexing.max_nprobe` cap return 400 with
            the canonical error envelope; values above the segment's actual
            cluster count behave as probing all clusters. When omitted, a
            flat segment uses 3/16 of its actual clusters with the runtime
            default_nprobe as a floor; hierarchical queries use that floor.
        include_attributes:
          type: boolean
          default: true
          description: |
            When false, result `attributes` are returned as null. Unfiltered
            ANN queries skip final attribute enrichment, and unfiltered BM25
            segment queries skip attribute-object reads.
        sources:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CandidateSource"
        fusion:
          $ref: "#/components/schemas/FusionSpec"
        rerank:
          $ref: "#/components/schemas/RerankSpec"
        grouping:
          $ref: "#/components/schemas/GroupingSpec"
        facets:
          type: array
          description: |
            Attribute fields to count. Counts are computed over vectors that
            match the query filter within the retrieved/filtered candidate
            frontier, not over the whole namespace and not only over the
            returned `top_k`. Unknown or absent fields return empty counts.
            List-valued attributes contribute once for each listed value.
          items:
            $ref: "#/components/schemas/FacetSpec"
        projection:
          $ref: "#/components/schemas/ProjectionSpec"
        cursor:
          $ref: "#/components/schemas/CursorSpec"
        explain:
          $ref: "#/components/schemas/ExplainSpec"
        debug:
          type: boolean
          default: false
          description: |
            When true, include an optional `debug` block in the query response
            with phase timings, scan counts, cache counters, effective
            consistency, and under-fill reason. Omitted by default. A principal
            with a mandatory filter cannot request namespace-wide physical
            diagnostics: `debug: true` returns 403 `constraint_violation`.
    CandidateSource:
      description: Typed retrieval-algebra candidate source.
      discriminator:
        propertyName: type
        mapping:
          ann: "#/components/schemas/AnnCandidateSource"
          bm25: "#/components/schemas/Bm25CandidateSource"
      oneOf:
        - $ref: "#/components/schemas/AnnCandidateSource"
        - $ref: "#/components/schemas/Bm25CandidateSource"

    AnnCandidateSource:
      type: object
      required: [type]
      additionalProperties: false
      description: |
        ANN candidate source. Provide exactly one of `vector` or `id`.
        When `id` is used, Zeppelin loads that stored vector from the
        namespace and excludes the seed id from returned results, including
        fused hybrid results.
      properties:
        type:
          type: string
          const: ann
        vector:
          type: array
          items:
            type: number
            format: float
          description: Query vector for ANN search.
        id:
          type: string
          description: Stored vector id to use as the ANN query seed.
        nprobe:
          type: integer
          minimum: 1
          maximum: 256
          description: Source-local IVF probe count.

    Bm25CandidateSource:
      type: object
      required: [type, rank_by]
      additionalProperties: false
      properties:
        type:
          type: string
          const: bm25
        rank_by:
          $ref: "#/components/schemas/RankByExpression"
        last_as_prefix:
          type: boolean
          default: false
          description: Treat the last token of each BM25 query as a prefix.

    FusionSpec:
      description: |
        Multi-source fusion strategy. Omitted `fusion` defaults to RRF with
        `k=60` for multi-source requests. `none` is accepted with a single
        source only.
      discriminator:
        propertyName: type
        mapping:
          none: "#/components/schemas/FusionNone"
          rrf: "#/components/schemas/FusionRrf"
          weighted: "#/components/schemas/FusionWeighted"
      oneOf:
        - $ref: "#/components/schemas/FusionNone"
        - $ref: "#/components/schemas/FusionRrf"
        - $ref: "#/components/schemas/FusionWeighted"

    FusionNone:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          const: none

    FusionRrf:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          const: rrf
        k:
          type: integer
          minimum: 1
          default: 60
          description: Reciprocal rank fusion smoothing constant.

    FusionWeighted:
      type: object
      required: [type, weights]
      additionalProperties: false
      properties:
        type:
          type: string
          const: weighted
        weights:
          type: array
          minItems: 1
          items:
            type: number
            format: float
          description: |
            Per-source weights in `sources` order. The length must equal the
            number of sources. Each source score list is min-max normalized
            to [0,1] before weighting; ANN distances are inverted so lower
            distance contributes a higher normalized score.

    RerankSpec:
      description: |
        Explicit rerank strategy over the first-stage candidate frontier.
        `vector` rescoring uses the namespace distance metric against the
        supplied rerank vector. `bm25` rescoring uses the configured FTS
        tokenization and BM25 parameters over the materialized candidate set.
        `default` and `none` preserve the normal source execution order.
      discriminator:
        propertyName: type
        mapping:
          default: "#/components/schemas/RerankDefault"
          none: "#/components/schemas/RerankNone"
          vector: "#/components/schemas/RerankVector"
          bm25: "#/components/schemas/RerankBm25"
      oneOf:
        - $ref: "#/components/schemas/RerankDefault"
        - $ref: "#/components/schemas/RerankNone"
        - $ref: "#/components/schemas/RerankVector"
        - $ref: "#/components/schemas/RerankBm25"

    RerankDefault:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          const: default

    RerankNone:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          const: none

    RerankVector:
      type: object
      required: [type, vector]
      additionalProperties: false
      properties:
        type:
          type: string
          const: vector
        vector:
          type: array
          items:
            type: number
            format: float

    RerankBm25:
      type: object
      required: [type, rank_by]
      additionalProperties: false
      properties:
        type:
          type: string
          const: bm25
        rank_by:
          $ref: "#/components/schemas/RankByExpression"

    GroupingSpec:
      description: |
        Result grouping strategy. Field grouping collapses hits by an
        attribute value, keeps at most `max_per_group` hits in each group,
        and applies `top_k` to the number of groups. Hits missing the group
        field form singleton groups keyed by their own ids. Field grouping
        cannot be combined with cursor pagination.
      discriminator:
        propertyName: type
        mapping:
          none: "#/components/schemas/GroupingNone"
          field: "#/components/schemas/GroupingField"
      oneOf:
        - $ref: "#/components/schemas/GroupingNone"
        - $ref: "#/components/schemas/GroupingField"

    GroupingNone:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          const: none

    GroupingField:
      type: object
      required: [type, field, max_per_group]
      additionalProperties: false
      properties:
        type:
          type: string
          const: field
        field:
          type: string
        max_per_group:
          type: integer
          minimum: 1

    FacetSpec:
      type: string
      minLength: 1
      description: Attribute field name to count by value.

    ProjectionSpec:
      type: object
      additionalProperties: false
      description: |
        Response projection. `include_attributes` is executable today and is
        mutually exclusive with the legacy top-level `include_attributes`.
        Field-level projection and vector inclusion are reserved.
      properties:
        include_attributes:
          type: boolean
          default: true
        fields:
          type: array
          items:
            type: string
          description: Reserved for field-level attribute projection.
        include_vectors:
          type: boolean
          default: false
          description: Reserved for returning vector values in query results.

    CursorSpec:
      description: |
        Cursor continuation strategy. Use `{"type":"none"}` on the first
        page to request a `next_cursor`; pass that value back with
        `{"type":"after","token":"..."}` to continue after the last item
        from the previous page. Cursor tokens are stateless, opaque, and
        authenticated with HMAC-SHA256; callers must not inspect or modify
        them. They bind the namespace, result-affecting query shape, and issuing
        policy version. Consuming a token after the policy version changes
        returns 400 `cursor_policy_stale`; restart from the first page. Response
        options such as debug, explain, facets, and projection do not change
        the token fingerprint. Consistency and the query route's exact `as_of`
        selector do change it and must be repeated on every continuation.
        Cursor pagination cannot be combined with field grouping.
      discriminator:
        propertyName: type
        mapping:
          none: "#/components/schemas/CursorNone"
          after: "#/components/schemas/CursorAfter"
      oneOf:
        - $ref: "#/components/schemas/CursorNone"
        - $ref: "#/components/schemas/CursorAfter"

    CursorNone:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          const: none

    CursorAfter:
      type: object
      required: [type, token]
      additionalProperties: false
      properties:
        type:
          type: string
          const: after
        token:
          type: string

    ExplainSpec:
      description: |
        Explain output request. `true` and `"plan"` return the executed
        plan. `"full"` additionally returns per-result score provenance for
        the returned hits. `false` and `"none"` omit the response block.
      oneOf:
        - type: boolean
        - type: string
          enum: [none, plan, full]

    BatchQueryRequest:
      type: object
      required: [queries]
      additionalProperties: false
      properties:
        queries:
          type: array
          minItems: 1
          maxItems: 256
          description: Positional list of single-query request bodies.
          items:
            $ref: "#/components/schemas/QueryRequest"

    QueryResponse:
      type: object
      required: [results, scanned_fragments, scanned_segments]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        scanned_fragments:
          type: integer
          description: |
            Number of WAL fragments scanned. This is deliberately zero for a
            response constrained by a mandatory filter, regardless of physical
            work, to prevent a cross-slice activity oracle.
        scanned_segments:
          type: integer
          description: |
            Number of index segments scanned. This is deliberately zero for a
            response constrained by a mandatory filter, regardless of physical
            work, to prevent a cross-slice activity oracle.
        debug:
          $ref: "#/components/schemas/QueryDebug"
        next_cursor:
          type: string
          description: |
            Opaque cursor for the next page. Present only when cursor
            pagination is enabled and more ranked results remain in the
            current candidate frontier.
        groups:
          type: array
          description: Present only when result grouping is requested.
          items:
            $ref: "#/components/schemas/QueryResultGroup"
        facets:
          $ref: "#/components/schemas/QueryFacets"
        explain:
          $ref: "#/components/schemas/QueryExplain"
    QueryResultGroup:
      type: object
      required: [key, results]
      properties:
        key:
          type: string
          description: Group key; missing group fields use the hit id.
        results:
          type: array
          description: Ranked hits retained for this group.
          items:
            $ref: "#/components/schemas/SearchResult"

    QueryFacets:
      type: object
      description: |
        Present only when `facets` is requested. Top-level keys are the
        requested facet fields. Nested keys are stringified attribute values
        and nested values are counts within the retrieved/filtered candidate
        frontier. List-valued attributes contribute once for each listed
        value; hits missing a requested field do not contribute.
      additionalProperties:
        type: object
        additionalProperties:
          type: integer
          minimum: 0

    QueryExplain:
      type: object
      required: [mode, plan]
      description: |
        Present only when explain is enabled. Explain is pure observability:
        adding it does not change ranking, result order, or projection.
      properties:
        mode:
          type: string
          enum: [plan, full]
        plan:
          $ref: "#/components/schemas/QueryExplainPlan"
        results:
          type: array
          description: Present only for `full` explain.
          items:
            $ref: "#/components/schemas/QueryExplainResult"

    QueryExplainPlan:
      type: object
      required:
        - path
        - candidate_k
        - first_stage_top_k
        - top_k
        - consistency
        - sources
        - fusion
        - rerank
        - grouping
        - cursor
        - facets
        - projection
        - policy_filter_applied
      properties:
        path:
          type: string
          enum: [legacy_vector, legacy_bm25, algebra_single, algebra_hybrid]
          description: Physical query path that executed.
        candidate_k:
          type: integer
          minimum: 1
          description: Effective request candidate_k after defaults.
        first_stage_top_k:
          type: integer
          minimum: 1
          description: Candidate frontier retained before final operators.
        top_k:
          type: integer
          minimum: 1
        consistency:
          $ref: "#/components/schemas/ConsistencyLevel"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/QueryExplainSource"
        fusion:
          $ref: "#/components/schemas/QueryExplainFusion"
        rerank:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/QueryExplainRerank"
        grouping:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/QueryExplainGrouping"
        cursor:
          $ref: "#/components/schemas/QueryExplainCursor"
        facets:
          type: array
          items:
            type: string
        projection:
          $ref: "#/components/schemas/QueryExplainProjection"
        policy_filter_applied:
          type: boolean
          description: |
            True when a server-owned mandatory filter constrained execution.
            The predicate itself is never exposed.

    QueryExplainSource:
      type: object
      required: [index, type, nprobe, candidate_k]
      properties:
        index:
          type: integer
          minimum: 0
        type:
          type: string
          enum: [ann, bm25]
        nprobe:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Effective IVF probe count for unconstrained ANN sources. Null for
            BM25 and for mandatory-filter callers, because a manifest-derived
            value would reveal shared namespace topology outside their row slice.
        candidate_k:
          type: integer
          minimum: 1

    QueryExplainFusion:
      oneOf:
        - $ref: "#/components/schemas/QueryExplainFusionNone"
        - $ref: "#/components/schemas/QueryExplainFusionRrf"
        - $ref: "#/components/schemas/QueryExplainFusionWeighted"

    QueryExplainFusionNone:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: none

    QueryExplainFusionRrf:
      type: object
      required: [type, k]
      properties:
        type:
          type: string
          const: rrf
        k:
          type: integer
          minimum: 1

    QueryExplainFusionWeighted:
      type: object
      required: [type, weights]
      properties:
        type:
          type: string
          const: weighted
        weights:
          type: array
          items:
            type: number
            format: float

    QueryExplainRerank:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [default, none, vector, bm25]

    QueryExplainGrouping:
      oneOf:
        - $ref: "#/components/schemas/QueryExplainGroupingNone"
        - $ref: "#/components/schemas/QueryExplainGroupingField"

    QueryExplainGroupingNone:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: none

    QueryExplainGroupingField:
      type: object
      required: [type, field, max_per_group]
      properties:
        type:
          type: string
          const: field
        field:
          type: string
        max_per_group:
          type: integer
          minimum: 1

    QueryExplainCursor:
      type: object
      required: [requested, after]
      properties:
        requested:
          type: boolean
        after:
          type: boolean

    QueryExplainProjection:
      type: object
      required: [include_attributes]
      properties:
        include_attributes:
          type: boolean

    QueryExplainResult:
      type: object
      required: [id, sources, fused_score]
      properties:
        id:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/QueryExplainResultSource"
        fused_score:
          type: number
          format: float
          description: Score after fusion, before explicit rerank.
        rerank_score:
          type: number
          format: float
          description: Present only when explicit rerank ran for this hit.

    QueryExplainResultSource:
      type: object
      required: [index, type, raw_score, contribution]
      properties:
        index:
          type: integer
          minimum: 0
        type:
          type: string
          enum: [ann, bm25]
        raw_score:
          type: number
          format: float
        normalized_score:
          type: number
          format: float
          description: Present for weighted fusion.
        contribution:
          type: number
          format: float

    QueryDebug:
      type: object
      required:
        - wal_ms
        - segment_ms
        - merge_ms
        - fragments_scanned
        - segments_scanned
        - clusters_probed
        - cache
        - consistency_effective
        - underfill_reason
      description: "Present only when the request sets `debug: true`."
      properties:
        wal_ms:
          type: integer
          minimum: 0
          description: WAL scan phase latency in milliseconds.
        segment_ms:
          type: integer
          minimum: 0
          description: Segment search phase latency in milliseconds.
        merge_ms:
          type: integer
          minimum: 0
          description: Result merge phase latency in milliseconds.
        fragments_scanned:
          type: integer
          minimum: 0
          description: Same semantics as top-level `scanned_fragments`.
        segments_scanned:
          type: integer
          minimum: 0
          description: Same semantics as top-level `scanned_segments`.
        clusters_probed:
          type: integer
          minimum: 0
          description: Number of IVF clusters probed or BM25 fallback clusters scanned.
        cache:
          $ref: "#/components/schemas/QueryDebugCache"
        consistency_effective:
          $ref: "#/components/schemas/ConsistencyLevel"
        underfill_reason:
          type: string
          nullable: true
          enum:
            - eventual_skipped_wal
            - no_index_or_wal_data
            - not_enough_matches
            - null
          description: Null when the response filled `top_k`.

    QueryDebugCache:
      type: object
      required: [hits, misses]
      properties:
        hits:
          type: integer
          minimum: 0
        misses:
          type: integer
          minimum: 0

    BatchQueryResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          description: Positional entry responses matching the request order.
          items:
            $ref: "#/components/schemas/BatchQueryEntry"

    BatchQueryEntry:
      oneOf:
        - $ref: "#/components/schemas/BatchQuerySuccess"
        - $ref: "#/components/schemas/BatchQueryFailure"

    BatchQuerySuccess:
      type: object
      required: [ok, response, metadata]
      properties:
        ok:
          type: boolean
          enum: [true]
        response:
          $ref: "#/components/schemas/QueryResponse"
        metadata:
          $ref: "#/components/schemas/BatchQueryEntryMetadata"

    BatchQueryFailure:
      type: object
      required: [ok, error, metadata]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          $ref: "#/components/schemas/ErrorResponse"
        metadata:
          $ref: "#/components/schemas/BatchQueryEntryMetadata"

    BatchQueryEntryMetadata:
      type: object
      required: [latency_ms]
      properties:
        latency_ms:
          type: integer
          minimum: 0
          description: |
            Server-side latency for this batch entry. Mandatory-filter callers
            receive the sentinel value 0 so shared-namespace work cannot be
            inferred from an explicit timing diagnostic.
