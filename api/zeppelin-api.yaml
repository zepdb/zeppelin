openapi: 3.1.0
info:
  title: Zeppelin Vector Search API
  description: S3-native vector search engine with BM25 full-text search support.
  version: 0.2.0
  license:
    name: Apache-2.0

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Health check
      description: Returns server health status. Always returns 200 if the process is running.
      tags: [Health]
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      operationId: readinessCheck
      summary: Readiness check
      description: Verifies S3 connectivity. Returns 503 if the storage backend is unreachable.
      tags: [Health]
      responses:
        "200":
          description: Server is ready
          content:
            application/json:
              schema:
                type: object
                required: [status, s3_connected]
                properties:
                  status:
                    type: string
                    example: ready
                  s3_connected:
                    type: boolean
                    example: true
        "503":
          description: Server is not ready
          content:
            application/json:
              schema:
                type: object
                required: [status, s3_connected]
                properties:
                  status:
                    type: string
                    example: not_ready
                  s3_connected:
                    type: boolean
                    example: false
                  error:
                    type: string

  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics
      description: Returns Prometheus-formatted metrics.
      tags: [Health]
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string

  /v1/namespaces:
    post:
      operationId: createNamespace
      summary: Create a namespace
      description: |
        Creates a new namespace with the specified dimensions and distance metric.
        If `name` is omitted, the server generates a UUID v4 namespace name for
        backward compatibility. If `name` is present, it must be 1-255
        characters, start with an ASCII alphanumeric character, contain only
        ASCII alphanumeric, dash, underscore, or dot characters, and be safe as
        both an S3 top-level key prefix and a single URL path segment.

        Client-specified names are idempotent: the same name with the same
        immutable configuration returns `200` and the existing namespace;
        the same name with different dimensions, distance metric, or full-text
        search configuration returns `409` with code `NAMESPACE_ALREADY_EXISTS`.
      tags: [Namespaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNamespaceRequest"
      responses:
        "200":
          description: Existing namespace returned for idempotent create-by-name with identical configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateNamespaceResponse"
        "201":
          description: Namespace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateNamespaceResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/NamespaceAlreadyExistsError"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/namespaces/{ns}:
    parameters:
      - $ref: "#/components/parameters/NamespacePath"

    get:
      operationId: getNamespace
      summary: Get namespace
      description: Returns metadata for a single namespace.
      tags: [Namespaces]
      responses:
        "200":
          description: Namespace metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespaceResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"

    delete:
      operationId: deleteNamespace
      summary: Delete namespace
      description: |
        Marks a namespace as deleting and starts resumable background cleanup.
        Re-issuing DELETE while cleanup is in progress resumes cleanup. Once
        cleanup finishes, the namespace returns 404.
      tags: [Namespaces]
      responses:
        "202":
          description: Namespace deletion accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteNamespaceResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /v1/namespaces/{ns}/index_config:
    parameters:
      - $ref: "#/components/parameters/NamespacePath"

    patch:
      operationId: updateNamespaceIndexConfig
      summary: Stage namespace index config
      description: |
        Stages per-namespace indexing parameters for future compactions. The
        response returns after `meta.json` is updated; the active segment is
        rewritten asynchronously on the next compaction. Observe progress and
        health with `GET /v1/namespaces/{ns}`.
      tags: [Namespaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchNamespaceIndexConfigRequest"
      responses:
        "202":
          description: Index config update accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateIndexConfigResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "410":
          $ref: "#/components/responses/NamespaceDeletingError"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/namespaces/{ns}/hydrate:
    parameters:
      - $ref: "#/components/parameters/NamespacePath"

    post:
      operationId: triggerNamespaceHydration
      summary: Queue namespace hydration
      description: |
        Asynchronously queues the namespace's current active segment for
        warm-set hydration. The response is returned after enqueueing; it does
        not wait for segment objects to finish downloading into the local cache.

        A `202` response means the request entered the hydrator pipeline. The
        pipeline still applies incremental-segment and capacity safety gates.
        Gate refusals also return `202` here and are observable through
        `zeppelin_hydration_skipped_total`, `zeppelin_hydration_refused`, and
        `zeppelin_hydration_required_bytes`.
      tags: [Namespaces]
      responses:
        "202":
          description: Hydration request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HydrateNamespaceResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/HydrationDisabled"

  /v1/namespaces/{ns}/vectors:
    parameters:
      - $ref: "#/components/parameters/NamespacePath"

    post:
      operationId: upsertVectors
      summary: Upsert vectors
      description: Insert or update vectors in a namespace. Vectors with existing IDs are overwritten.
      tags: [Vectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertVectorsRequest"
      responses:
        "200":
          description: Vectors upserted
          content:
            application/json:
              schema:
                type: object
                required: [upserted]
                properties:
                  upserted:
                    type: integer
                    example: 100
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "410":
          $ref: "#/components/responses/NamespaceDeletingError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

    delete:
      operationId: deleteVectors
      summary: Delete vectors
      description: Delete vectors by ID from a namespace.
      tags: [Vectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteVectorsRequest"
      responses:
        "204":
          description: Vectors deleted
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "410":
          $ref: "#/components/responses/NamespaceDeletingError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /v1/namespaces/{ns}/vectors/get:
    parameters:
      - $ref: "#/components/parameters/NamespacePath"

    post:
      operationId: getVectors
      summary: Fetch vectors by ID
      description: |
        Fetch explicit vector IDs with projection controls. Found records are
        returned in request order. Missing IDs and tombstoned IDs are reported
        in `missing` and are never silently mapped to another record.

        `consistency=strong` sees latest committed WAL writes and deletes.
        `consistency=eventual` reads the active segment plus WAL tombstones, so
        it may miss recent uncompacted upserts while still suppressing deleted
        segment records.
      tags: [Vectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetVectorsRequest"
      responses:
        "200":
          description: Fetched records and explicit missing IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetVectorsResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "410":
          $ref: "#/components/responses/NamespaceDeletingError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /v1/namespaces/{ns}/query:
    parameters:
      - $ref: "#/components/parameters/NamespacePath"

    post:
      operationId: queryNamespace
      summary: Query vectors
      description: |
        Run vector similarity search, BM25 full-text search, or typed
        retrieval-algebra search. Legacy requests provide exactly one of
        `vector` or `rank_by`; retrieval-algebra requests provide typed
        `sources`, with multi-source `ann` + `bm25` fusion supported by RRF
        or weighted normalized score.
      tags: [Query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Query results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "410":
          $ref: "#/components/responses/NamespaceDeletingError"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /v1/namespaces/{ns}/query/batch:
    parameters:
      - $ref: "#/components/parameters/NamespacePath"

    post:
      operationId: batchQueryNamespace
      summary: Batch query vectors
      description: |
        Run multiple vector similarity or BM25 full-text searches in one
        request. Each entry uses the same body shape as `POST
        /v1/namespaces/{ns}/query`.

        Results are returned positionally. A failure in one entry is reported
        in that entry's error envelope and does not fail the whole batch.
        Entries share one manifest freshness check and segment metadata load.
      tags: [Query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchQueryRequest"
      responses:
        "200":
          description: Positional batch query results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchQueryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          $ref: "#/components/responses/NotImplemented"

components:
  parameters:
    NamespacePath:
      name: ns
      in: path
      required: true
      schema:
        type: string
      description: Namespace name

  responses:
    ValidationError:
      description: Validation error (400)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: Resource not found (404)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NamespaceDeletingError:
      description: Namespace is being deleted (410)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    HydrationDisabled:
      description: Hydration is disabled by configuration (409)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NamespaceAlreadyExistsError:
      description: Namespace already exists with different immutable configuration (409)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: |
        Request body exceeds the configured byte limit, or a logical request
        batch exceeds its configured item cap (413). Canonical error envelope
        with code `PAYLOAD_TOO_LARGE`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotImplemented:
      description: |
        Recognized request contract reserved for a later implementation (501).
        Canonical error envelope with code `NOT_IMPLEMENTED`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limit exceeded (429)
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: |
        Missing or non-JSON Content-Type header (415), for endpoints that use
        the JSON extractor (namespace create). Plain-text body.
      content:
        text/plain:
          schema:
            type: string
            example: "Expected request with `Content-Type: application/json`"
    UnprocessableEntity:
      description: |
        Body is valid JSON but fails deserialization on the namespace-create
        endpoint (422). Plain-text body. NOTE: the vectors upsert/delete and
        query endpoints instead return 400 with the canonical error envelope
        (code VALIDATION_ERROR) for malformed bodies.
      content:
        text/plain:
          schema:
            type: string
            example: "Failed to deserialize the JSON body into the target type: missing field `dimensions`"

  schemas:
    ErrorResponse:
      type: object
      required: [code, error, status, retryable]
      properties:
        code:
          type: string
          description: |
            Stable, machine-readable error code. Clients should branch on this,
            never on `error` (human text) or `status` alone. Every code is
            enumerated below and is guaranteed stable across releases.
          enum:
            - VALIDATION_ERROR
            - DIMENSION_MISMATCH
            - NAMESPACE_NOT_FOUND
            - NAMESPACE_ALREADY_EXISTS
            - HYDRATION_DISABLED
            - FTS_FIELD_NOT_CONFIGURED
            - CONFLICT_RETRY
            - RATE_LIMITED
            - CONCURRENCY_LIMIT
            - REQUEST_TIMEOUT
            - PAYLOAD_TOO_LARGE
            - NOT_IMPLEMENTED
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - INTERNAL_DATA_MISSING
            - DATA_CORRUPTION
            - STORAGE_ERROR
            - INTERNAL_ERROR
        error:
          type: string
          description: Human-readable, client-safe message. Never contains internal S3 keys, endpoints, or tokens.
        status:
          type: integer
          description: HTTP status code
        retryable:
          type: boolean
          description: |
            Whether retrying the identical request may succeed. True for
            conflicts (CONFLICT_RETRY), rate limits, concurrency, timeouts, and
            transient storage errors; responses with `retryable: true` at 409/
            429/503/408 also carry a `Retry-After` header.
        request_id:
          type: string
          description: |
            Echo of the request's `x-request-id` (or a server-generated UUID).
            Present on routes that carry the request-id middleware; omitted on
            the lightweight query hot path. Use it to correlate with server logs.
      example:
        code: NAMESPACE_NOT_FOUND
        error: "namespace not found: test"
        status: 404
        retryable: false
        request_id: "b3f1c2e4-..."

    DistanceMetric:
      type: string
      enum: [cosine, euclidean, dot_product]
      default: cosine

    QuantizationType:
      type: string
      enum: [none, scalar, product]
      description: Quantization mode recorded on the active segment.

    NamespaceIndexConfig:
      type: object
      required: [nlist, quantization, pq_m, hierarchical, fts_index, bitmap_index]
      properties:
        nlist:
          type: integer
          minimum: 1
          description: Number of IVF centroids/clusters used by future compactions.
        quantization:
          $ref: "#/components/schemas/QuantizationType"
        pq_m:
          type: integer
          minimum: 1
          description: Product-quantization subquantizers; must divide namespace dimensions when quantization is `product`.
        hierarchical:
          type: boolean
          description: Whether future compactions build a hierarchical index.
        fts_index:
          type: boolean
          description: Whether future compactions build segment FTS indexes.
        bitmap_index:
          type: boolean
          description: Whether future compactions build bitmap prefilter indexes.

    CreateNamespaceIndexConfig:
      type: object
      properties:
        nlist:
          type: integer
          minimum: 1
        quantization:
          $ref: "#/components/schemas/QuantizationType"
        pq_m:
          type: integer
          minimum: 1
        hierarchical:
          type: boolean
        fts_index:
          type: boolean
        bitmap_index:
          type: boolean
      description: Partial per-namespace index config overlay.

    PatchNamespaceIndexConfigRequest:
      allOf:
        - $ref: "#/components/schemas/CreateNamespaceIndexConfig"
      minProperties: 1
      description: Partial per-namespace index config update; at least one field is required.

    IndexKind:
      type: string
      enum: [ivf_flat, ivf_sq, ivf_pq, hierarchical]
      description: Index kind used by the namespace's active segment.

    ConsistencyLevel:
      type: string
      description: |
        `strong` scans un-compacted WAL fragments and indexed segments.
        `eventual` skips WAL vector/BM25 scoring for fresher upserts and updates,
        but still applies WAL delete tombstones so deleted vectors do not appear
        after a successful delete on the same node.
      enum: [strong, eventual]
      default: strong

    FtsLanguage:
      type: string
      enum: [english]
      default: english

    AttributeValue:
      description: |
        A scalar or array attribute value. One of:
        - string
        - integer (int64)
        - number (float64)
        - boolean
        - array of strings
        - array of integers
        - array of numbers
      oneOf:
        - type: string
        - type: integer
          format: int64
        - type: number
          format: double
        - type: boolean
        - type: array
          items:
            type: string
        - type: array
          items:
            type: integer
            format: int64
        - type: array
          items:
            type: number
            format: double

    FtsFieldConfig:
      type: object
      description: Per-field configuration for full-text search.
      properties:
        language:
          $ref: "#/components/schemas/FtsLanguage"
        stemming:
          type: boolean
          default: true
          description: Whether to apply stemming (e.g., "running" -> "run").
        remove_stopwords:
          type: boolean
          default: true
          description: Whether to remove common stopwords.
        case_sensitive:
          type: boolean
          default: false
          description: Whether matching is case-sensitive.
        k1:
          type: number
          format: float
          default: 1.2
          description: "BM25 k1 parameter: term frequency saturation."
        b:
          type: number
          format: float
          default: 0.75
          description: "BM25 b parameter: length normalization."
        max_token_length:
          type: integer
          default: 40
          description: Maximum token length; tokens exceeding this are discarded.

    Filter:
      type: object
      required: [op]
      description: |
        Filter condition discriminated by the `op` field. Supported operators:
        - `eq`: Exact match on a field
        - `not_eq`: Not equal
        - `range`: Numeric range (gte, lte, gt, lt)
        - `in`: Field value is one of the given values
        - `not_in`: Field value is not one of the given values
        - `contains`: Array field contains the given value
        - `contains_all_tokens`: All tokens must be present (order-independent)
        - `contains_token_sequence`: Tokens must appear as exact phrase
        - `and`: All sub-filters must match
        - `or`: Any sub-filter must match
        - `not`: Negate a sub-filter
      discriminator:
        propertyName: op
        mapping:
          eq: "#/components/schemas/FilterEq"
          not_eq: "#/components/schemas/FilterNotEq"
          range: "#/components/schemas/FilterRange"
          in: "#/components/schemas/FilterIn"
          not_in: "#/components/schemas/FilterNotIn"
          contains: "#/components/schemas/FilterContains"
          contains_all_tokens: "#/components/schemas/FilterContainsAllTokens"
          contains_token_sequence: "#/components/schemas/FilterContainsTokenSequence"
          and: "#/components/schemas/FilterAnd"
          or: "#/components/schemas/FilterOr"
          not: "#/components/schemas/FilterNot"
      oneOf:
        - $ref: "#/components/schemas/FilterEq"
        - $ref: "#/components/schemas/FilterNotEq"
        - $ref: "#/components/schemas/FilterRange"
        - $ref: "#/components/schemas/FilterIn"
        - $ref: "#/components/schemas/FilterNotIn"
        - $ref: "#/components/schemas/FilterContains"
        - $ref: "#/components/schemas/FilterContainsAllTokens"
        - $ref: "#/components/schemas/FilterContainsTokenSequence"
        - $ref: "#/components/schemas/FilterAnd"
        - $ref: "#/components/schemas/FilterOr"
        - $ref: "#/components/schemas/FilterNot"

    FilterEq:
      type: object
      required: [op, field, value]
      properties:
        op:
          type: string
          const: eq
        field:
          type: string
        value:
          $ref: "#/components/schemas/AttributeValue"

    FilterNotEq:
      type: object
      required: [op, field, value]
      properties:
        op:
          type: string
          const: not_eq
        field:
          type: string
        value:
          $ref: "#/components/schemas/AttributeValue"

    FilterRange:
      type: object
      required: [op, field]
      properties:
        op:
          type: string
          const: range
        field:
          type: string
        gte:
          type: number
        lte:
          type: number
        gt:
          type: number
        lt:
          type: number

    FilterIn:
      type: object
      required: [op, field, values]
      properties:
        op:
          type: string
          const: in
        field:
          type: string
        values:
          type: array
          items:
            $ref: "#/components/schemas/AttributeValue"

    FilterNotIn:
      type: object
      required: [op, field, values]
      properties:
        op:
          type: string
          const: not_in
        field:
          type: string
        values:
          type: array
          items:
            $ref: "#/components/schemas/AttributeValue"

    FilterContains:
      type: object
      required: [op, field, value]
      properties:
        op:
          type: string
          const: contains
        field:
          type: string
        value:
          $ref: "#/components/schemas/AttributeValue"

    FilterContainsAllTokens:
      type: object
      required: [op, field, tokens]
      properties:
        op:
          type: string
          const: contains_all_tokens
        field:
          type: string
        tokens:
          type: array
          items:
            type: string

    FilterContainsTokenSequence:
      type: object
      required: [op, field, tokens]
      properties:
        op:
          type: string
          const: contains_token_sequence
        field:
          type: string
        tokens:
          type: array
          items:
            type: string

    FilterAnd:
      type: object
      required: [op, filters]
      properties:
        op:
          type: string
          const: and
        filters:
          type: array
          items:
            $ref: "#/components/schemas/Filter"

    FilterOr:
      type: object
      required: [op, filters]
      properties:
        op:
          type: string
          const: or
        filters:
          type: array
          items:
            $ref: "#/components/schemas/Filter"

    FilterNot:
      type: object
      required: [op, filter]
      properties:
        op:
          type: string
          const: not
        filter:
          $ref: "#/components/schemas/Filter"

    RankByExpression:
      description: |
        BM25 ranking expression as an S-expression JSON array. Examples:
        - Single field: `["content", "BM25", "search query"]`
        - Multi-field sum: `["Sum", [["title", "BM25", "q"], ["content", "BM25", "q"]]]`
        - Weighted: `["Product", 2.0, ["title", "BM25", "q"]]`
        - Max: `["Max", [["title", "BM25", "q"], ["body", "BM25", "q"]]]`
      type: array
      items: {}
      examples:
        - ["content", "BM25", "search query"]
        - ["Sum", [["title", "BM25", "q"], ["content", "BM25", "q"]]]
        - ["Product", 2.0, ["title", "BM25", "q"]]

    VectorEntry:
      type: object
      required: [id, values]
      properties:
        id:
          type: string
          description: Unique vector identifier
        values:
          type: array
          items:
            type: number
            format: float
          description: Vector embedding values
        attributes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AttributeValue"
          description: Optional key-value metadata for filtering

    SearchResult:
      type: object
      required: [id, score, attributes]
      properties:
        id:
          type: string
          description: Vector identifier
        score:
          type: number
          format: float
          description: Distance (vector search, lower is better) or BM25 relevance score (higher is better)
        attributes:
          type: object
          nullable: true
          additionalProperties:
            $ref: "#/components/schemas/AttributeValue"
          description: Result attributes, or null when include_attributes is false.

    CreateNamespaceRequest:
      type: object
      required: [dimensions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
          description: |
            Optional client-specified namespace name. Must be safe as both an
            S3 top-level key prefix and a single URL path segment: 1-255
            characters, starts with ASCII alphanumeric, and then contains only
            ASCII alphanumeric, dash, underscore, or dot characters. Names are
            validated at creation time and are not coerced.
        dimensions:
          type: integer
          minimum: 1
          maximum: 65536
          description: Vector dimensionality
        distance_metric:
          $ref: "#/components/schemas/DistanceMetric"
        full_text_search:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/FtsFieldConfig"
          description: Per-field FTS configuration. Keys are attribute field names.
        index_config:
          $ref: "#/components/schemas/CreateNamespaceIndexConfig"
          description: Optional per-namespace index config. Missing fields inherit server defaults.

    CreateNamespaceResponse:
      description: Response from namespace creation or idempotent create-by-name.
      allOf:
        - $ref: "#/components/schemas/NamespaceResponse"
        - type: object
          required: [warning]
          properties:
            warning:
              type: string
              description: Creation note. Generated UUID namespaces include a warning to save the name.
              example: "Save this namespace name. It cannot be recovered if lost."

    NamespaceResponse:
      type: object
      required:
        - name
        - dimensions
        - distance_metric
        - vector_count
        - uncompacted_fragments
        - segment_count
        - approximate_storage_bytes
        - quantization
        - index_kind
        - index_config
        - active_segment_vector_count
        - last_compaction_at
        - last_compaction_status
        - consecutive_compaction_failures
        - index_degraded
        - created_at
        - updated_at
        - state
      properties:
        name:
          type: string
        dimensions:
          type: integer
        distance_metric:
          $ref: "#/components/schemas/DistanceMetric"
        vector_count:
          type: integer
          format: int64
          description: |
            Manifest-derived live entry count: compacted segment vector counts
            plus uncompacted WAL vector entries minus uncompacted WAL tombstones,
            lower-bounded at zero. Exact for the manifest aggregate; an upper
            bound on unique live vector IDs until compaction resolves duplicate
            upserts by ID.
        uncompacted_fragments:
          type: integer
          description: Number of WAL fragments currently referenced by the manifest.
        segment_count:
          type: integer
          description: Number of segment refs currently tracked by the manifest.
        approximate_storage_bytes:
          type: integer
          format: int64
          description: |
            Approximate live storage bytes known from manifest refs
            (`FragmentRef.size_bytes` and segment artifact size refs). This value
            is derived without object listing or HEAD calls; legacy refs with
            unknown sizes contribute zero for those artifacts.
        quantization:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/QuantizationType"
          description: Active segment quantization mode, or null before first compaction.
        index_kind:
          $ref: "#/components/schemas/IndexKind"
        index_config:
          $ref: "#/components/schemas/NamespaceIndexConfig"
          description: Effective desired index parameters for future compactions.
        active_segment_vector_count:
          type: integer
          description: Vector count in the active segment only, excluding uncompacted WAL.
        last_compaction_at:
          type: string
          format: date-time
          nullable: true
          description: Last recorded compaction completion or failure timestamp.
        last_compaction_status:
          type: string
          enum: [never, success, failure]
          description: Last recorded compaction status.
        last_compaction_error:
          type: string
          description: Last compaction failure message. Omitted unless the last compaction failed.
        consecutive_compaction_failures:
          type: integer
          description: Consecutive compaction failures since the last success.
        index_degraded:
          type: boolean
          description: True after five consecutive compaction failures.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        state:
          type: string
          enum: [active, deleting]
          description: |
            Namespace lifecycle state. `deleting` means deletion has started;
            reads and writes against data endpoints return 410 while cleanup
            completes.
        full_text_search:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/FtsFieldConfig"
          description: Present only when FTS fields are configured.

    DeleteNamespaceResponse:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [deleting]
          description: Namespace deletion has been accepted and cleanup is resumable.

    HydrateNamespaceResponse:
      type: object
      required: [namespace, segment_id]
      properties:
        namespace:
          type: string
          description: Namespace whose active segment was queued.
        segment_id:
          type: string
          description: Active segment id queued into the hydrator pipeline.

    UpdateIndexConfigResponse:
      type: object
      required: [namespace, index_config, status, observe]
      properties:
        namespace:
          type: string
        index_config:
          $ref: "#/components/schemas/NamespaceIndexConfig"
        status:
          type: string
          const: accepted
        observe:
          type: string
          description: Human-readable observation hint for the asynchronous compaction rewrite.

    UpsertVectorsRequest:
      type: object
      required: [vectors]
      properties:
        vectors:
          type: array
          items:
            $ref: "#/components/schemas/VectorEntry"
          minItems: 1
          maxItems: 50000

    DeleteVectorsRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          items:
            type: string

    GetVectorsRequest:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
          description: Vector IDs to fetch. Duplicates are rejected.
        include_vector:
          type: boolean
          default: true
          description: Include vector values in found records.
        include_attributes:
          type: boolean
          default: true
          description: Include attributes in found records.
        attribute_fields:
          type: array
          minItems: 1
          items:
            type: string
          description: |
            Optional attribute field allow-list. Valid only when
            `include_attributes=true`; missing fields are omitted.
        consistency:
          $ref: "#/components/schemas/ConsistencyLevel"

    GetVectorsResponse:
      type: object
      required: [results, missing]
      properties:
        results:
          type: array
          description: Found live records in request order.
          items:
            $ref: "#/components/schemas/FetchedVectorRecord"
        missing:
          type: array
          description: Requested IDs that were absent or tombstoned.
          items:
            type: string

    FetchedVectorRecord:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Vector identifier.
        values:
          type: array
          items:
            type: number
            format: float
          description: Present only when `include_vector=true`.
        attributes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AttributeValue"
          description: Present only when included and non-empty after projection.

    QueryRequest:
      type: object
      additionalProperties: false
      description: |
        Query request contract. Legacy requests continue to provide exactly
        one of `vector` or `rank_by`. Retrieval-algebra requests provide
        `sources` and may include typed `fusion`, `rerank`, `grouping`,
        `projection`, `cursor`, and `explain` contracts.

        Implemented today:
        - legacy `vector`
        - legacy `rank_by`
        - single-source `ann`
        - single-source `bm25`
        - multi-source RRF fusion (`fusion` omitted defaults to RRF k=60)
        - multi-source weighted normalized score fusion
        - `projection.include_attributes`

        Reserved today (returns code `NOT_IMPLEMENTED`):
        - explicit vector/BM25 rerank
        - grouped results
        - cursor pagination
        - enabled explain output
        - field/vector projection
      properties:
        vector:
          type: array
          items:
            type: number
            format: float
          description: Query vector for ANN search
        rank_by:
          $ref: "#/components/schemas/RankByExpression"
        last_as_prefix:
          type: boolean
          default: false
          description: Treat the last token of each BM25 query as a prefix (for autocomplete).
        top_k:
          type: integer
          default: 10
          minimum: 1
          maximum: 10000
          description: Number of results to return
        candidate_k:
          type: integer
          minimum: 1
          description: |
            Per-source candidate count before multi-source fusion. Defaults
            to `max(top_k * 4, 100)`. The fused list is then truncated to
            `top_k`. Only used by multi-source retrieval-algebra execution.
        filter:
          $ref: "#/components/schemas/Filter"
        consistency:
          $ref: "#/components/schemas/ConsistencyLevel"
        nprobe:
          type: integer
          minimum: 1
          maximum: 256
          description: |
            Number of IVF clusters to probe (vector search only). Values
            above the configured `indexing.max_nprobe` cap return 400 with
            the canonical error envelope; values above the segment's actual
            cluster count behave as probing all clusters.
        include_attributes:
          type: boolean
          default: true
          description: |
            When false, result `attributes` are returned as null. Unfiltered
            ANN queries skip final attribute enrichment, and unfiltered BM25
            segment queries skip attribute-object reads.
        sources:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CandidateSource"
        fusion:
          $ref: "#/components/schemas/FusionSpec"
        rerank:
          $ref: "#/components/schemas/RerankSpec"
        grouping:
          $ref: "#/components/schemas/GroupingSpec"
        projection:
          $ref: "#/components/schemas/ProjectionSpec"
        cursor:
          $ref: "#/components/schemas/CursorSpec"
        explain:
          $ref: "#/components/schemas/ExplainSpec"

    CandidateSource:
      description: Typed retrieval-algebra candidate source.
      discriminator:
        propertyName: type
        mapping:
          ann: "#/components/schemas/AnnCandidateSource"
          bm25: "#/components/schemas/Bm25CandidateSource"
      oneOf:
        - $ref: "#/components/schemas/AnnCandidateSource"
        - $ref: "#/components/schemas/Bm25CandidateSource"

    AnnCandidateSource:
      type: object
      required: [type, vector]
      additionalProperties: false
      properties:
        type:
          type: string
          const: ann
        vector:
          type: array
          items:
            type: number
            format: float
          description: Query vector for ANN search.
        nprobe:
          type: integer
          minimum: 1
          maximum: 256
          description: Source-local IVF probe count.

    Bm25CandidateSource:
      type: object
      required: [type, rank_by]
      additionalProperties: false
      properties:
        type:
          type: string
          const: bm25
        rank_by:
          $ref: "#/components/schemas/RankByExpression"
        last_as_prefix:
          type: boolean
          default: false
          description: Treat the last token of each BM25 query as a prefix.

    FusionSpec:
      description: |
        Multi-source fusion strategy. Omitted `fusion` defaults to RRF with
        `k=60` for multi-source requests. `none` is accepted with a single
        source only.
      discriminator:
        propertyName: type
        mapping:
          none: "#/components/schemas/FusionNone"
          rrf: "#/components/schemas/FusionRrf"
          weighted: "#/components/schemas/FusionWeighted"
      oneOf:
        - $ref: "#/components/schemas/FusionNone"
        - $ref: "#/components/schemas/FusionRrf"
        - $ref: "#/components/schemas/FusionWeighted"

    FusionNone:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          const: none

    FusionRrf:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          const: rrf
        k:
          type: integer
          minimum: 1
          default: 60
          description: Reciprocal rank fusion smoothing constant.

    FusionWeighted:
      type: object
      required: [type, weights]
      additionalProperties: false
      properties:
        type:
          type: string
          const: weighted
        weights:
          type: array
          minItems: 1
          items:
            type: number
            format: float
          description: |
            Per-source weights in `sources` order. The length must equal the
            number of sources. Each source score list is min-max normalized
            to [0,1] before weighting; ANN distances are inverted so lower
            distance contributes a higher normalized score.

    RerankSpec:
      description: |
        Explicit rerank strategy. `default` and `none` are accepted as contract
        no-ops today; vector/BM25 rerank variants are reserved.
      discriminator:
        propertyName: type
        mapping:
          default: "#/components/schemas/RerankDefault"
          none: "#/components/schemas/RerankNone"
          vector: "#/components/schemas/RerankVector"
          bm25: "#/components/schemas/RerankBm25"
      oneOf:
        - $ref: "#/components/schemas/RerankDefault"
        - $ref: "#/components/schemas/RerankNone"
        - $ref: "#/components/schemas/RerankVector"
        - $ref: "#/components/schemas/RerankBm25"

    RerankDefault:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          const: default

    RerankNone:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          const: none

    RerankVector:
      type: object
      required: [type, vector]
      additionalProperties: false
      properties:
        type:
          type: string
          const: vector
        vector:
          type: array
          items:
            type: number
            format: float

    RerankBm25:
      type: object
      required: [type, rank_by]
      additionalProperties: false
      properties:
        type:
          type: string
          const: bm25
        rank_by:
          $ref: "#/components/schemas/RankByExpression"

    GroupingSpec:
      description: Result grouping strategy. Field grouping is typed but not executable yet.
      discriminator:
        propertyName: type
        mapping:
          none: "#/components/schemas/GroupingNone"
          field: "#/components/schemas/GroupingField"
      oneOf:
        - $ref: "#/components/schemas/GroupingNone"
        - $ref: "#/components/schemas/GroupingField"

    GroupingNone:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          const: none

    GroupingField:
      type: object
      required: [type, field, max_per_group]
      additionalProperties: false
      properties:
        type:
          type: string
          const: field
        field:
          type: string
        max_per_group:
          type: integer
          minimum: 1

    ProjectionSpec:
      type: object
      additionalProperties: false
      description: |
        Response projection. `include_attributes` is executable today and is
        mutually exclusive with the legacy top-level `include_attributes`.
        Field-level projection and vector inclusion are reserved.
      properties:
        include_attributes:
          type: boolean
          default: true
        fields:
          type: array
          items:
            type: string
          description: Reserved for field-level attribute projection.
        include_vectors:
          type: boolean
          default: false
          description: Reserved for returning vector values in query results.

    CursorSpec:
      description: Cursor continuation strategy. Opaque cursors are typed but not executable yet.
      discriminator:
        propertyName: type
        mapping:
          none: "#/components/schemas/CursorNone"
          after: "#/components/schemas/CursorAfter"
      oneOf:
        - $ref: "#/components/schemas/CursorNone"
        - $ref: "#/components/schemas/CursorAfter"

    CursorNone:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          const: none

    CursorAfter:
      type: object
      required: [type, token]
      additionalProperties: false
      properties:
        type:
          type: string
          const: after
        token:
          type: string

    ExplainSpec:
      description: |
        Explain output request. `false` and `"none"` are accepted; enabled
        explain output is rejected until responses carry explain payloads.
      oneOf:
        - type: boolean
        - type: string
          enum: [none, plan, full]

    BatchQueryRequest:
      type: object
      required: [queries]
      properties:
        queries:
          type: array
          minItems: 1
          maxItems: 256
          description: Positional list of single-query request bodies.
          items:
            $ref: "#/components/schemas/QueryRequest"

    QueryResponse:
      type: object
      required: [results, scanned_fragments, scanned_segments]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        scanned_fragments:
          type: integer
          description: Number of WAL fragments scanned
        scanned_segments:
          type: integer
          description: Number of index segments scanned

    BatchQueryResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          description: Positional entry responses matching the request order.
          items:
            $ref: "#/components/schemas/BatchQueryEntry"

    BatchQueryEntry:
      oneOf:
        - $ref: "#/components/schemas/BatchQuerySuccess"
        - $ref: "#/components/schemas/BatchQueryFailure"

    BatchQuerySuccess:
      type: object
      required: [ok, response, metadata]
      properties:
        ok:
          type: boolean
          enum: [true]
        response:
          $ref: "#/components/schemas/QueryResponse"
        metadata:
          $ref: "#/components/schemas/BatchQueryEntryMetadata"

    BatchQueryFailure:
      type: object
      required: [ok, error, metadata]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          $ref: "#/components/schemas/ErrorResponse"
        metadata:
          $ref: "#/components/schemas/BatchQueryEntryMetadata"

    BatchQueryEntryMetadata:
      type: object
      required: [latency_ms]
      properties:
        latency_ms:
          type: integer
          minimum: 0
          description: Server-side latency for this batch entry.
