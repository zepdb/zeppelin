# Azure VM and managed-disk catalog.
# PAYG Linux prices were captured 2026-08-05 from the public Azure Retail
# Prices API, excluding Spot, low-priority, Windows, and unrelated meters.
# VM specs and documented maximum network bandwidth were checked against
# the Microsoft Learn size-series tables. Azure exposes one maximum network
# figure per size, so baseline and burst are equal in this schema.
[meta]
cloud = "azure"
snapshot_date = "2026-08-05"
currency = "USD"
sources = [
    "https://prices.azure.com/api/retail/prices",
    "https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/general-purpose/dsv5-series",
    "https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/general-purpose/ddsv5-series",
    "https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/memory-optimized/esv5-series",
    "https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/memory-optimized/edsv5-series",
    "https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/storage-optimized/lsv3-series",
]

# Dsv5: no local temporary disk.
[[instance]]
name = "D4s_v5"
family = "Dsv5"
arch = "x86_64"
vcpus = 4
mem_gb = 16.0
nvme_gb = 0
network_baseline_gbps = 12.5
network_burst_gbps = 12.5
price_hr = { eastus = 0.192, westus2 = 0.192, westeurope = 0.230, germanywestcentral = 0.230, centralindia = 0.202, southeastasia = 0.240 }

