# AWS EC2 instance and EBS catalog.
# Prices verified 2026-08-05 across two independent sources: the Vantage
# open dataset and AWS's own on-demand pricing JSON (every compared price
# matched to 5 decimals). Specs and network baseline/burst confirmed
# against docs.aws.amazon.com/ec2/latest/instancetypes/.
# Notes:
#   - i3en has no 4xlarge/8xlarge; 3xlarge and 6xlarge are the real ladder.
#   - network_baseline_gbps is the sustained figure; burst is AWS "up to".
#   - us-west-2 prices equal us-east-1 across all listed SKUs (verified).
[meta]
cloud = "aws"
snapshot_date = "2026-08-05"
currency = "USD"
sources = [
    "https://instances.vantage.sh/instances.json",
    "https://b0.p.awsstatic.com/pricing/2.0/meteredUnitMaps/ec2/USD/current/ec2-ondemand-without-sec-sel/",
    "https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonEC2/current/us-east-1/index.csv",
    "https://docs.aws.amazon.com/ec2/latest/instancetypes/",
]

