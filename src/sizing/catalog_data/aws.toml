# EBS us-east-1 base rates from the AWS Bulk Price List CSV (2026-08-05).
# io2 uses tiered IOPS pricing ($0.065 first 32K, $0.0455 to 64K, $0.03185
# above); the single price_per_iops_month below is the first tier, which
# covers every cache-volume shape the advisor recommends.
# gp2 bundles IOPS with capacity (3 IOPS/GiB, burst to 3K below 1 TiB).
# Regional multipliers: eu-west-1 measured 1.10; us-west-2 1.00;
# eu-central-1/ap-south-1/ap-southeast-1 pattern-derived estimates.

[[block_storage]]
name = "gp3"
price_gb_month = 0.08
included_iops = 3000
included_throughput_mbps = 125
price_per_iops_month = 0.005
price_per_throughput_mbps_month = 0.04
max_iops = 80000
max_throughput_mbps = 2000
