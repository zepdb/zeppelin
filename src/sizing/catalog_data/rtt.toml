# Curated cross-region RTT medians (ms) for the (discouraged) cross-region
# case. AWS pairs: cloudping.co P50 matrix, 1-day window, Aug 2026,
# averaged across both directions. Azure pairs: Microsoft's published
# monthly P50s (doc updated 2026-07-30). GCP pairs: gcping-derived
# estimates.
[meta]
snapshot_date = "2026-08-05"
currency = "USD"
sources = [
    "https://www.cloudping.co/",
    "https://learn.microsoft.com/en-us/azure/networking/azure-network-latency",
    "https://gcping.com/",
]

