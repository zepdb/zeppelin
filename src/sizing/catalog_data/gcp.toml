# GCP Compute Engine instance and Persistent Disk/Hyperdisk catalog.
# Prices were captured 2026-08-05 from the public Cloud Billing catalog
# mirror and checked against Google Cloud pricing pages. Network figures
# are the standard per-VM caps; Tier_1 values are recorded as burst because
# enabling Tier_1 can carry an additional networking charge.
#
# Z3 prices include the bundled Titanium SSD. Z3 uses real `-highlssd` /
# `-standardlssd` SKU names and 3,000-GB SSD increments; plain names such
# as `z3-highmem-8` do not exist.
[meta]
cloud = "gcp"
snapshot_date = "2026-08-05"
currency = "USD"
sources = [
    "https://cloud.google.com/products/compute/pricing",
    "https://cloud.google.com/compute/disks-image-pricing",
    "https://docs.cloud.google.com/compute/docs/general-purpose-machines",
    "https://docs.cloud.google.com/compute/docs/storage-optimized-machines",
    "https://docs.cloud.google.com/compute/docs/network-bandwidth",
    "https://gcloud-compute.com/",
]

