schema_version = 1
scenario = "paginate"

[dataset]
vectors = 4096
dims = 64
nlist = 8
seed = 7
attrs = "none"
fts = "none"

[ns_config]
quantization = "sq8"

[server_config]
nprobe = 4
manifest_cache_ttl_ms = 3600000
memory_cache_max_mb = 256

[run]
cache_state = "warm"
repeats = 8

[run.measure]
op = "query_pages"
consistency = "strong"
pages = 2
page_size = 2
query_index = 0

[baseline]
git_rev = "20f7d4069e94fb3bb33aca9a96a71f36d085d26e"
captured = "2026-07-28T21:38:56Z"
approved_by = "anup"
reason = "Initial Phase 2 freeze after audited MinIO capture: two serialized cursor pages each retain their measured three-stage read anatomy. Rebaselined at 20f7d40 by anup 2026-07-28 for the ZBP5 cluster-payload improvement ONLY. Cluster-class bytes fell 2.0% on unfiltered query paths and 4.7% on filtered and compaction paths; cold_query_strong cluster GETs went 7 -> 4 and cold_query_sketch_adc 11 -> 6, independently confirming tests/get_count_bench.rs from a second measurement path. Cause: e2983a6 (ZBP5 codecs, hoisted IDs, fixed-stride f32 rows) and 35d9f4d (manifest row layouts, ranged cluster reads). Only cluster-class fields and GET counts moved in this commit; manifest-shaped bands are a separate cause and a separate acceptance. Depth was NOT retightened: 100 depth-stability samples show cold_query_strong at {5: 100} against a governed max of 7, so the bound is satisfied and narrowing it is its own decision."

[assert.depth.get]
mode = "exact"
value = 6
why = "two serialized cursor pages each retain their measured three-stage read anatomy."

