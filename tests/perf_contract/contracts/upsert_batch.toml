[baseline]
git_rev = "23accb3534f02dd47885495cc1eb65279da91f87"
captured = "2026-07-26T05:30:14.010052+00:00"
approved_by = "anup"
reason = "D9 acceptance, 2026-07-26 at 23accb3, after Anup reviewed the before/after table. Per COLD writer round the manifest-history work adds one manifest GET, one PUT, a second manifests/ history object, and two critical-path levels (put_get depth 4 -> 6). This is a first-write-after-start cost, NOT a per-write tax: the warm shape is unaffected and stays pinned at 0 GETs / 3 physical ops (tests/perf_contract/ideal/direct.rs:264, assert_group_commit_warm_shape), which passes. The harness forces the cold pre-state deliberately (scenario.rs:915). Manifest-shaped bytes grow ~3.5x from the receipt artifact inventory accepted in a887d3c. Captured in release; the security latency budgets in this catalog are release-calibrated."

[assert.depth.put_get]
mode = "exact"
value = 6
why = "manifest read, WAL write, history write, and manifest CAS form exact depth four."

