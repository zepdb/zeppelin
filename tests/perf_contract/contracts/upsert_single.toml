[baseline]
git_rev = "9adc1cb500dba7407e7fc6875bd353f7e1050202"
captured = "2026-07-28T05:09:03Z"
approved_by = "anup"
reason = "D9 acceptance, 2026-07-26 at 23accb3, after Anup reviewed the before/after table. Per COLD writer round the manifest-history work adds one manifest GET, one PUT, a second manifests/ history object, and two critical-path levels (put_get depth 4 -> 6). This is a first-write-after-start cost, NOT a per-write tax: the warm shape is unaffected and stays pinned at 0 GETs / 3 physical ops (tests/perf_contract/ideal/direct.rs:264, assert_group_commit_warm_shape), which passes. The harness forces the cold pre-state deliberately (scenario.rs:915). Manifest-shaped bytes grow ~3.5x from the receipt artifact inventory accepted in a887d3c. Captured in release; the security latency budgets in this catalog are release-calibrated. Receipt removal at 9ff6fbd, d83ad82, and 9adc1cb deleted the Merkle modules, the signed manifest roots with the artifact-hash inventory, and the execution-state digest; every manifest-shaped object shrank and per-repeat history growth dropped from ~180 B to ~35 B, so the manifest, other, and total byte bands are re-derived at 9adc1cb from the release gate and the 100-sample depth-stability run. Operation counts, key counts, critical-path depth, and non-manifest bytes are unchanged and were NOT re-approved."

[assert.depth.put_get]
mode = "exact"
value = 6
why = "current HEAD: one WAL PUT, manifest GET, history PUT, and manifest CAS"

