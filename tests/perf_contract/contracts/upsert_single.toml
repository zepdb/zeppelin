schema_version = 1
scenario = "upsert_single"

[dataset]
vectors = 512
dims = 64
nlist = 4
seed = 11
attrs = "none"
fts = "none"

[server_config]
manifest_cache_ttl_ms = 0
memory_cache_max_mb = 256
