[baseline]
git_rev = "20f7d4069e94fb3bb33aca9a96a71f36d085d26e"
captured = "2026-07-28T21:39:43Z"
approved_by = "anup"
reason = "D9 acceptance, 2026-07-26 at 23accb3, after Anup reviewed the before/after table. Per COLD writer round the manifest-history work adds one manifest GET, one PUT, a second manifests/ history object, and two critical-path levels (put_get depth 4 -> 6). This is a first-write-after-start cost, NOT a per-write tax: the warm shape is unaffected and stays pinned at 0 GETs / 3 physical ops (tests/perf_contract/ideal/direct.rs:264, assert_group_commit_warm_shape), which passes. The harness forces the cold pre-state deliberately (scenario.rs:915). Manifest-shaped bytes grow ~3.5x from the receipt artifact inventory accepted in a887d3c. Captured in release; the security latency budgets in this catalog are release-calibrated. Receipt removal at 9ff6fbd, d83ad82, and 9adc1cb deleted the Merkle modules, the signed manifest roots with the artifact-hash inventory, and the execution-state digest; every manifest-shaped object shrank and per-repeat history growth dropped from ~180 B to ~35 B, so the manifest, other, and total byte bands are re-derived at 9adc1cb from the release gate and the 100-sample depth-stability run. Operation counts, key counts, critical-path depth, and non-manifest bytes are unchanged and were NOT re-approved. Cost acceptance at 20f7d40 by anup 2026-07-28 for the row_layouts manifest growth from 35d9f4d. Measured ~25 bytes per cluster per manifest, consistently: +198 B per manifest read at nlist=8 (as_of_query, compaction_incremental), +591 B over three manifest reads in gc_cycle, +364 B at nlist=16 in cold_query_sketch_adc. This is a WRITE-path byte cost paid on the manifest CAS-PUT of every WAL append and on every manifest read, bought for the query-path GET reduction accepted in 86986b5. Accepted on the same reasoning as slice 6.3 (results/coalescing-gap.md): in-region S3 bytes are free and GETs cost $0.40/M. SCALE CAVEAT, recorded deliberately: contract fixtures use nlist 4-16, so this measures ~200 B of a cost that production pays at nlist 256-4096, where it is ~8 KB at a typical nlist=334 and ~100 KB at the upper bound. The gate cannot see that; see results/g4-recapture-20f7d40.md. Bands keep their documented method: 4x the 100-sample depth-stability spread with a 32 B floor for manifest-shaped reads, 256 B each side of the eight gate repeats for the write scenarios."

