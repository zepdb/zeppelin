schema_version = 1
scenario = "compaction_cycle"

[dataset]
vectors = 4096
dims = 64
nlist = 8
seed = 7
attrs = "none"
fts = "none"

[ns_config]
quantization = "sq8"

[server_config]
nprobe = 1
manifest_cache_ttl_ms = 0
memory_cache_max_mb = 256
max_wal_fragments_before_compact = 64

[run]
cache_state = "warm"
repeats = 1

[run.measure]
op = "compact"
fragments = 4
incremental = false

[baseline]
git_rev = "2ed1b9b63b616828d2904424d3050848d93ee8b2"
captured = "2026-07-27T19:49:38.222904+00:00"
approved_by = "anup"
reason = "G4 recapture at 2ed1b9b accepts the 20-byte bootstrap growth from 46bebaf: ZBS1 v2 adds the complete-bitmap-fields section to the compacted segment. Operation counts, critical-path depth, and all other immutable artifact bytes are unchanged."

[assert.depth.put_get]
mode = "exact"
value = 13
why = "four WAL reads, the full artifact census, history write, and manifest CAS form exact depth twelve."

