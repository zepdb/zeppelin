schema_version = 1
scenario = "compaction_cycle"

[dataset]
vectors = 4096
dims = 64
nlist = 8
seed = 7
attrs = "none"
fts = "none"

[ns_config]
quantization = "sq8"

[server_config]
nprobe = 1
manifest_cache_ttl_ms = 0
memory_cache_max_mb = 256
max_wal_fragments_before_compact = 64

[run]
cache_state = "warm"
repeats = 1

[run.measure]
op = "compact"
fragments = 4
incremental = false

[baseline]
git_rev = "9adc1cb500dba7407e7fc6875bd353f7e1050202"
captured = "2026-07-28T05:09:03Z"
approved_by = "anup"
reason = "D9 acceptance, 2026-07-26 at 23accb3, after Anup reviewed the before/after table. Two independent changes: (1) manifest GETs DROP 3 -> 2 because f42b368 moved assert_manifest_fragment_count out of the measured window - a harness artifact removal, not a product change, and the reason the old baseline was above reality; (2) the manifest-history work adds one other GET, one PUT, a second manifests/ history object, and one critical-path level. Byte growth is the receipt artifact inventory accepted in a887d3c and is small in relative terms here (+0.2% GET / +0.3% PUT for the full cycle) because artifact bytes dominate. Captured in release. ZBS1 v2 at 46bebaf adds a 16-byte section directory and a 4-byte empty field count, increasing the immutable bootstrap by 20 bytes. Receipt removal at 9ff6fbd, d83ad82, and 9adc1cb deleted the Merkle modules, the signed manifest roots with the artifact-hash inventory, and the execution-state digest; every manifest-shaped object (live manifest and history generations) shrank, so the manifest, other, and total byte bands are re-derived at 9adc1cb from the release gate and the 100-sample depth-stability run. Operation counts, key counts, critical-path depth, and non-manifest bytes are unchanged and were NOT re-approved."

[assert.depth.put_get]
mode = "exact"
value = 13
why = "four WAL reads, the full artifact census, history write, and manifest CAS form exact depth twelve."

