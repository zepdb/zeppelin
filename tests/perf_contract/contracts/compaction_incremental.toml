[run.measure]
op = "compact"
fragments = 4
incremental = true

[baseline]
git_rev = "2ed1b9b63b616828d2904424d3050848d93ee8b2"
captured = "2026-07-27T19:49:38.222904+00:00"
approved_by = "anup"
reason = "G4 recapture at 2ed1b9b accepts 46bebaf's incremental-compaction cost: one bootstrap GET and one critical-path level preserve complete-bitmap coverage from the old segment, while ZBS1 v2 adds 20 bytes to the rewritten bootstrap. Other operation counts and immutable artifact bytes are unchanged."

[assert.depth.put_get]
mode = "exact"
value = 15
why = "resident-state reads including the old bootstrap, four WAL reads, bounded rewrites, history, and manifest CAS form exact depth fifteen."

