captured = "2026-07-26T05:30:14.010052+00:00"
approved_by = "anup"
reason = "D9 acceptance, 2026-07-26 at 23accb3, after Anup reviewed the before/after table. Two independent changes: (1) manifest GETs DROP 3 -> 2 because f42b368 moved assert_manifest_fragment_count out of the measured window - a harness artifact removal, not a product change, and the reason the old baseline was above reality; (2) the manifest-history work adds one other GET, one PUT, a second manifests/ history object, and one critical-path level. Byte growth is the receipt artifact inventory accepted in a887d3c and is small in relative terms here (+0.2% GET / +0.3% PUT for the full cycle) because artifact bytes dominate. Captured in release."

