[baseline]
git_rev = "20f7d4069e94fb3bb33aca9a96a71f36d085d26e"
captured = "2026-07-28T21:39:43Z"
approved_by = "anup"
reason = "D9 acceptance, 2026-07-26 at 23accb3, after Anup reviewed the before/after table. Two independent changes: (1) manifest GETs DROP 3 -> 2 because f42b368 moved assert_manifest_fragment_count out of the measured window - a harness artifact removal, not a product change, and the reason the old baseline was above reality; (2) the manifest-history work adds one other GET, one PUT, a second manifests/ history object, and one critical-path level. Byte growth is the receipt artifact inventory accepted in a887d3c and is small in relative terms here (+0.2% GET / +0.3% PUT for the full cycle) because artifact bytes dominate. Captured in release. At feffd2d, embedded-sketch reuse removes one standalone sketch-read level, reducing exact put/get depth from 14 to 13. Together, 3d7164a and feffd2d replace the centroid and sketch GETs with one bootstrap GET, reducing total GETs from 13 to 12 without moving the total-byte band. ZBS1 v2 at 46bebaf adds a 16-byte section directory and a 4-byte empty field count, increasing the immutable bootstrap by 20 bytes. Receipt removal at 9ff6fbd, d83ad82, and 9adc1cb deleted the Merkle modules, the signed manifest roots with the artifact-hash inventory, and the execution-state digest; every manifest-shaped object (live manifest and history generations) shrank, so the manifest, other, and total byte bands are re-derived at 9adc1cb from the release gate and the 100-sample depth-stability run. Operation counts, key counts, critical-path depth, and non-manifest bytes are unchanged and were NOT re-approved. Rebaselined at 20f7d40 by anup 2026-07-28 for the ZBP5 cluster-payload improvement ONLY. Cluster-class bytes fell 2.0% on unfiltered query paths and 4.7% on filtered and compaction paths; cold_query_strong cluster GETs went 7 -> 4 and cold_query_sketch_adc 11 -> 6, independently confirming tests/get_count_bench.rs from a second measurement path. Cause: e2983a6 (ZBP5 codecs, hoisted IDs, fixed-stride f32 rows) and 35d9f4d (manifest row layouts, ranged cluster reads). Only cluster-class fields and GET counts moved in this commit; manifest-shaped bands are a separate cause and a separate acceptance. Depth was NOT retightened: 100 depth-stability samples show cold_query_strong at {5: 100} against a governed max of 7, so the bound is satisfied and narrowing it is its own decision. Cost acceptance at 20f7d40 by anup 2026-07-28 for the row_layouts manifest growth from 35d9f4d. Measured ~25 bytes per cluster per manifest, consistently: +198 B per manifest read at nlist=8 (as_of_query, compaction_incremental), +591 B over three manifest reads in gc_cycle, +364 B at nlist=16 in cold_query_sketch_adc. This is a WRITE-path byte cost paid on the manifest CAS-PUT of every WAL append and on every manifest read, bought for the query-path GET reduction accepted in 86986b5. Accepted on the same reasoning as slice 6.3 (results/coalescing-gap.md): in-region S3 bytes are free and GETs cost $0.40/M. SCALE CAVEAT, recorded deliberately: contract fixtures use nlist 4-16, so this measures ~200 B of a cost that production pays at nlist 256-4096, where it is ~8 KB at a typical nlist=334 and ~100 KB at the upper bound. The gate cannot see that; see results/g4-recapture-20f7d40.md. Bands keep their documented method: 4x the 100-sample depth-stability spread with a 32 B floor for manifest-shaped reads, 256 B each side of the eight gate repeats for the write scenarios."

