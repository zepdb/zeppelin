schema_version = 1
scenario = "compaction_incremental"

[dataset]
vectors = 4096
dims = 64
nlist = 8
seed = 7
attrs = "none"
fts = "none"

[ns_config]
quantization = "sq8"

[server_config]
nprobe = 1
manifest_cache_ttl_ms = 0
memory_cache_max_mb = 256
max_wal_fragments_before_compact = 64

[run]
cache_state = "warm"
