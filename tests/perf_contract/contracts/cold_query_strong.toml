schema_version = 1
scenario = "cold_query_strong"

[dataset]
vectors = 4096
dims = 64
nlist = 8
seed = 7
attrs = "none"
fts = "none"

[ns_config]
quantization = "sq8"

[server_config]
nprobe = 4
manifest_cache_ttl_ms = 0
memory_cache_max_mb = 256

[run]
cache_state = "cold"
repeats = 1

[run.measure]
op = "query"
consistency = "strong"
top_k = 10
query_index = 0

[baseline]
git_rev = "ade36ce7c6f22c91ba8ee0cf5d74796f448ebca8"
captured = "2026-07-12T04:41:16Z"
approved_by = "anup"
reason = "Rebaseline after ade36ce preserves manifest namespace identity while removing verification GETs; operations, depth, and quantized artifact bytes are unchanged."

[assert.depth.get]
mode = "max"
value = 7
why = "100 samples: {6: 99, 7: 1}; parallel grouped header/SQ pipelines have completion-order jitter before rerank"

