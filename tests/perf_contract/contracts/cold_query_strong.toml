schema_version = 1
scenario = "cold_query_strong"

[dataset]
vectors = 4096
dims = 64
nlist = 8
seed = 7
attrs = "none"
fts = "none"

[ns_config]
quantization = "sq8"

[server_config]
nprobe = 4
manifest_cache_ttl_ms = 0
memory_cache_max_mb = 256

[run]
cache_state = "cold"
repeats = 1

[run.measure]
op = "query"
consistency = "strong"
top_k = 10
query_index = 0

[baseline]
git_rev = "20f7d4069e94fb3bb33aca9a96a71f36d085d26e"
captured = "2026-07-28T21:38:56Z"
approved_by = "anup"
reason = "Byte-only rebaseline at 437e9ff. The security and branching tracks add 13 persisted manifest fields; the receipt artifact inventory (`artifact_hashes`, bb51e04) dominates and is populated unconditionally, roughly doubling serialized manifest size. Accepted as the intended cost of receipts. Operation counts, key counts, critical-path depth, and quantized artifact bytes are unchanged and were NOT re-approved. ZBS1 v2 at 46bebaf adds a 16-byte section directory and a 4-byte empty field count, increasing the immutable bootstrap by 20 bytes. Receipt removal at 9ff6fbd, d83ad82, and 9adc1cb deleted the Merkle modules, the signed manifest roots with the artifact-hash inventory, and the execution-state digest; every manifest-shaped object shrank, so the manifest and total byte bands are re-derived at 9adc1cb from the release gate and the 100-sample depth-stability run. Operation counts, key counts, critical-path depth, and non-manifest bytes are unchanged and were NOT re-approved. Rebaselined at 20f7d40 by anup 2026-07-28 for the ZBP5 cluster-payload improvement ONLY. Cluster-class bytes fell 2.0% on unfiltered query paths and 4.7% on filtered and compaction paths; cold_query_strong cluster GETs went 7 -> 4 and cold_query_sketch_adc 11 -> 6, independently confirming tests/get_count_bench.rs from a second measurement path. Cause: e2983a6 (ZBP5 codecs, hoisted IDs, fixed-stride f32 rows) and 35d9f4d (manifest row layouts, ranged cluster reads). Only cluster-class fields and GET counts moved in this commit; manifest-shaped bands are a separate cause and a separate acceptance. Depth was NOT retightened: 100 depth-stability samples show cold_query_strong at {5: 100} against a governed max of 7, so the bound is satisfied and narrowing it is its own decision."

[assert.depth.get]
mode = "max"
value = 7
why = "100 samples: {6: 99, 7: 1}; parallel grouped header/SQ pipelines have completion-order jitter before rerank"

[assert.gets]
attrs = 0
bitmap = 0
bootstrap = 1
centroids = 0
cluster = 4
fts = 0
manifest = 1
other = 1
sketch = 0
sq = 0
total = 7
wal = 0

[assert.puts]
attrs = 0
bitmap = 0
bootstrap = 0
centroids = 0
cluster = 0
fts = 0
manifest = 0
other = 0
sketch = 0
sq = 0
total = 0
wal = 0

[assert.get_bytes.attrs]
exact = 0

[assert.get_bytes.bitmap]
exact = 0

[assert.get_bytes.bootstrap]
exact = 297633
why = "capture pins the immutable bootstrap object size"

[assert.get_bytes.centroids]
exact = 0

[assert.get_bytes.cluster]
exact = 420436
why = "capture pins the measured cluster GETs (seven before ZBP5, four after) Re-derived at 20f7d40: ZBP5 row layouts (e2983a6 codecs, 35d9f4d manifest layouts and ranged reads) removed the grouped-object directory GET and shrank the cluster payload encoding."

[assert.get_bytes.fts]
exact = 0

[assert.get_bytes.manifest]
min = 2763
max = 2844
why = "manifest-shaped objects encode timestamps at variable width, so this count is not byte-deterministic: 5 samples on 437e9ff spanned 5675..5683 (8 B). Band is 4x the observed spread (min 32 B), which absorbs the jitter while still failing on a doubling or a disappearance. Re-derived at 9adc1cb after receipt removal: 100 stability samples spanned 2799..2808 (9 B); same 4x padding."

[assert.get_bytes.other]
exact = 693
why = "fresh namespace metadata GET"

[assert.get_bytes.sketch]
exact = 0

[assert.get_bytes.sq]
