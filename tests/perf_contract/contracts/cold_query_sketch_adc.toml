schema_version = 1
scenario = "cold_query_sketch_adc"

[dataset]
vectors = 4096
dims = 64
nlist = 16
seed = 7
attrs = "none"
fts = "none"

[ns_config]
quantization = "sq8"

[server_config]
nprobe = 16
manifest_cache_ttl_ms = 0
memory_cache_max_mb = 256

[run]
cache_state = "cold"
repeats = 1

[run.measure]
op = "query"
consistency = "strong"
top_k = 10
query_index = 0

[baseline]
git_rev = "437e9ffeafba7a5e34ed1e0a7df6914330f6f6e0"
captured = "2026-07-25T06:10:54Z"
approved_by = "anup"
reason = "Byte-only rebaseline at 437e9ff. The security and branching tracks add 13 persisted manifest fields; the receipt artifact inventory (`artifact_hashes`, bb51e04) dominates and is populated unconditionally, roughly doubling serialized manifest size. Accepted as the intended cost of receipts. Operation counts, key counts, critical-path depth, and quantized artifact bytes are unchanged and were NOT re-approved."

[assert.depth.get]
mode = "exact"
value = 6
why = "cold metadata, manifest, bootstrap, and grouped clusters form exact depth six"

[assert.gets]
attrs = 0
bitmap = 0
bootstrap = 1
centroids = 0
# 11 < nprobe 16 is reachable only when v4 sketch ranking prunes the probe
# set before grouped-object cluster reads; no recall assertion is needed.
cluster = 11
fts = 0
manifest = 1
other = 1
sketch = 0
sq = 0
total = 14
wal = 0

[assert.puts]
attrs = 0
bitmap = 0
bootstrap = 0
centroids = 0
cluster = 0
fts = 0
manifest = 0
other = 0
sketch = 0
sq = 0
total = 0
wal = 0

[assert.get_bytes.attrs]
exact = 0

[assert.get_bytes.bitmap]
exact = 0

[assert.get_bytes.bootstrap]
exact = 299694
why = "cold bootstrap embeds the resident v4 sketch; capture pins its size"

[assert.get_bytes.centroids]
exact = 0

[assert.get_bytes.cluster]
exact = 233694
why = "capture pins the grouped cluster payloads selected after v4 ranking"

[assert.get_bytes.fts]
exact = 0

[assert.get_bytes.manifest]
min = 9016
max = 9106
why = "manifest-shaped objects encode timestamps at variable width, so this count is not byte-deterministic: 5 samples on 437e9ff spanned 9056..9066 (10 B). Band is 4x the observed spread (min 32 B), which absorbs the jitter while still failing on a doubling or a disappearance."

[assert.get_bytes.other]
exact = 698

[assert.get_bytes.sketch]
exact = 0

[assert.get_bytes.sq]
exact = 0

[assert.get_bytes.total]
min = 543102
max = 543192
why = "manifest-shaped objects encode timestamps at variable width, so this count is not byte-deterministic: 5 samples on 437e9ff spanned 543142..543152 (10 B). Band is 4x the observed spread (min 32 B), which absorbs the jitter while still failing on a doubling or a disappearance."

[assert.get_bytes.wal]
exact = 0

