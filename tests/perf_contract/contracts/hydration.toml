schema_version = 1
scenario = "hydration"

[dataset]
vectors = 4096
dims = 64
nlist = 8
seed = 7
attrs = "none"
fts = "none"

[ns_config]
quantization = "sq8"

[server_config]
nprobe = 1
manifest_cache_ttl_ms = 3600000
memory_cache_max_mb = 256

[run]
cache_state = "warm_hydrated"
repeats = 1

[run.measure]
op = "hydrate"
attempts = 2

[baseline]
git_rev = "34dd8cae09c61079d0a77c0537086c9644670cc0"
captured = "2026-07-26T03:00:00Z"
approved_by = "anup"
reason = "Rebaseline at 34dd8ca accepting 6c850f5's per-job hydration authority revalidation. validate_hydration_job_authority (hydration.rs:862) re-reads the live manifest inside the worker's retry loop before any origin-qualified key is headed or fetched, checking namespace lifetime, deletion fence, manifest generation, and resolved physical owner. The queue separates the handler's read from the worker's execution, so unlike GC's mark-phase read this one is a genuine TOCTOU guard and cannot reuse the handler's observation. That adds one manifest GET and one critical-path level per hydration request: gets.manifest 2->4, gets.total 15->17, depth 31->33 for two requests. This rebaseline therefore accepts an OPERATION and DEPTH increase, a stronger claim than a887d3c's byte-only bands. Manifest bytes additionally carry the receipt artifact inventory growth already accepted in a887d3c, and are banded here because manifest-shaped objects are not byte-deterministic. Measured in release; the ns budgets in this catalog are release-calibrated."

[assert.depth.get]
mode = "exact"
value = 33
why = "two hydration requests include control reads, one worker-side authority revalidation each, twelve first-pass artifact GETs, and sixteen cache-validation HEADs."

