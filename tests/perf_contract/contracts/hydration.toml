max = 16212
why = "four manifest GETs of a receipt-bearing manifest. Manifest-shaped objects encode timestamps at variable width, so this is not byte-deterministic: 4 release samples on 34dd8ca spanned 16047..16080 (33 B). Band pads 4x the observed spread (min 32 B) on each side, absorbing jitter while still failing on a doubling or a disappearance."

