schema_version = 1
scenario = "gc_cycle"

[dataset]
vectors = 4096
dims = 64
nlist = 8
seed = 7
attrs = "none"
fts = "none"

[ns_config]
quantization = "sq8"

[server_config]
nprobe = 1
manifest_cache_ttl_ms = 0
memory_cache_max_mb = 256

[run]
cache_state = "warm"
repeats = 1

[run.measure]
op = "gc"

[baseline]
git_rev = "23accb3534f02dd47885495cc1eb65279da91f87"
captured = "2026-07-26T05:30:14.010052+00:00"
approved_by = "anup"
reason = "D9 acceptance, 2026-07-26 at 23accb3, after Anup reviewed the before/after table. BYTES ONLY: operation counts and critical-path depth are unchanged and were restored by 34dd8ca, which stopped GC's mark phase re-reading a live manifest the branch-root observation had already proven current. The growth is the receipt artifact inventory accepted in a887d3c, amplified here because a cycle reads 18 retained history generations: manifest 2.18x, history bodies 3.90x, total 3.53x. Captured in release."

[assert.depth.get]
mode = "exact"
value = 60
why = "three reads of each of eighteen retained histories plus lease and candidate checks form exact depth sixty."

