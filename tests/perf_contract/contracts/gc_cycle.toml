[assert.get_bytes.manifest]
min = 7638
max = 7827
why = "three live-manifest GETs of a receipt-bearing manifest. Manifest-shaped objects encode timestamps at variable width, so this is not byte-deterministic: 4 release samples on 23accb3 spanned 15924..15942 (18 B). Band pads 4x the observed spread (min 32 B) each side, absorbing jitter while still failing on a doubling or a disappearance. Re-derived at 9adc1cb after receipt removal: 100 stability samples spanned 7722..7743 (21 B); same 4x padding."

[assert.get_bytes.other]
min = 28503
max = 31905
why = "eighteen retained history generations, each manifest-shaped and therefore not byte-deterministic: 3 release samples spanned 106539..107232 (693 B). Same 4x-spread padding. Re-derived at 9adc1cb after receipt removal: 100 stability samples spanned 30015..30393 (378 B); same 4x padding."

[assert.get_bytes.sketch]
exact = 0

[assert.get_bytes.sq]
exact = 0

[assert.get_bytes.total]
min = 36141
max = 39732
why = "sum of the two manifest-shaped bands above; inherits their jitter and padding. Re-derived at 9adc1cb as the sum of the two re-derived bands above."

