schema_version = 1
scenario = "gc_cycle"

[dataset]
vectors = 4096
dims = 64
nlist = 8
seed = 7
attrs = "none"
fts = "none"

[ns_config]
quantization = "sq8"

[server_config]
nprobe = 1
manifest_cache_ttl_ms = 0
memory_cache_max_mb = 256

[run]
cache_state = "warm"
repeats = 1

[run.measure]
op = "gc"

[baseline]
git_rev = "9adc1cb500dba7407e7fc6875bd353f7e1050202"
captured = "2026-07-28T05:09:03Z"
approved_by = "anup"
reason = "D9 acceptance, 2026-07-26 at 23accb3, after Anup reviewed the before/after table. BYTES ONLY: operation counts and critical-path depth are unchanged and were restored by 34dd8ca, which stopped GC's mark phase re-reading a live manifest the branch-root observation had already proven current. The growth is the receipt artifact inventory accepted in a887d3c, amplified here because a cycle reads 18 retained history generations: manifest 2.18x, history bodies 3.90x, total 3.53x. Captured in release. Receipt removal at 9ff6fbd, d83ad82, and 9adc1cb deleted the Merkle modules, the signed manifest roots with the artifact-hash inventory, and the execution-state digest; the amplification runs in reverse here because every one of the 18 retained history generations shrank, so the manifest, history, and total byte bands are re-derived at 9adc1cb from the release gate and the 100-sample depth-stability run. Operation counts, key counts, critical-path depth, and non-manifest bytes are unchanged and were NOT re-approved."

[assert.depth.get]
mode = "exact"
value = 60
why = "three reads of each of eighteen retained histories plus lease and candidate checks form exact depth sixty."

[assert.gets]
attrs = 0
bitmap = 0
bootstrap = 0
centroids = 0
cluster = 0
fts = 0
manifest = 3
other = 57
sketch = 0
sq = 0
total = 60
wal = 0

