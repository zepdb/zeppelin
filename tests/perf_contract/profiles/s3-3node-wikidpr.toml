# AWS S3 Standard us-east-1 pricing and three m6i.xlarge-equivalent nodes.
# The RaBitQ row sizes are EXPECTED pending the July10Quant campaign:
# sq8=dims, 1-bit=dims/8, 2-bit=dims/4. That plan targets roughly 10x fewer
# bytes/query for wiki_dpr_e5 and requires later measured re-validation.
name = "s3-3node-wikidpr"

[storage]
ttfb_ms = { p50 = 15.0, p99 = 60.0 }
per_conn_MBps = 80.0
agg_MBps_per_node = 100000.0

[storage.price]
get_per_req = 0.0000004
put_per_req = 0.000005
egress_per_gb = 0.0

[node]
count = 3
vcpus = 4
mem_gb = 16
price_hr = 0.192
cpu_ms_per_query = 8.0

[client]
closed_loop_clients = 8

[whatif]
vectors = 21000000
dims = 768
nlist = 4096
nprobe = [8, 16, 32]
quantization = ["sq8", "rabitq-1bit", "rabitq-2bit"]
expected_quantization = ["rabitq-1bit", "rabitq-2bit"]

[whatif.row_bytes]
sq8 = 768
rabitq-1bit = 96
rabitq-2bit = 192
