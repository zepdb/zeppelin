# AWS S3 Standard us-east-1 pricing and three m6i.xlarge-equivalent nodes.
# Storage provenance: TTFB 15/60 ms and per-connection throughput 80 MB/s are
# assumed modeling anchors inherited from s3-standard-intra-region.
# Phase-4 on-storage cluster-quantization projection. Production today (Phase 2)
# quantizes only the resident sketch; 1-bit has no production path. RaBitQ row
# bytes include two f32 factors and dimensions padded to 256-d blocks.
name = "s3-3node-wikidpr"

[storage]
ttfb_ms = { p50 = 15.0, p99 = 60.0 }
per_conn_MBps = 80.0
agg_MBps_per_node = 100000.0

[storage.price]
get_per_req = 0.0000004
put_per_req = 0.000005
egress_per_gb = 0.0

[node]
count = 3
vcpus = 4
mem_gb = 16
price_hr = 0.192
cpu_ms_per_query = 8.0

[client]
closed_loop_clients = 8

[whatif]
vectors = 21000000
dims = 768
nlist = 4096
# 256 is the scale-aware production default; smaller values stay as diagnostics.
nprobe = [8, 16, 32, 256]
quantization = ["sq8", "rabitq-1bit", "rabitq-2bit"]
expected_quantization = ["rabitq-1bit", "rabitq-2bit"]

[whatif.row_bytes]
sq8 = 768
rabitq-1bit = 104
rabitq-2bit = 200
