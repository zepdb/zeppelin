CONSTANTS
  Namespaces = {"root", "branch", "child"}
  Incarnations = {"root", "branch", "child"}
  BranchIds = {"b1", "b2"}
  ScenarioModes = {"fork", "nested", "delete", "policy", "preservation", "cancel"}
  SourceGenerations = {0, 1, 2, 3}
  ConfigValues = {"cfg0", "cfg1"}
  PolicyVersions = {0, 1}
  MaxGeneration = 3
  MaxPolicyVersion = 1
  MaxRoots = 2
  MaxDepth = 2
  AllowPublishWithoutRoot = FALSE
  AllowDeleteWithRoots = FALSE
  AllowRootRemovalBeforeVisibilityGone = FALSE
  AllowRootRemovalBeforeReaderGrace = FALSE
  AllowActivateBeforeSubsystems = FALSE
  AllowVisibilityRemovalWithoutEvidence = FALSE
  AllowActivationWithoutPolicyGuard = FALSE
  AllowPolicyWritePastActivationGuard = FALSE
  AllowGuardRemovalBeforeNonceRevocation = FALSE
  AllowDestructionWithStalePreservation = FALSE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT ActiveBranchHasMatchingRoot
INVARIANT RootPinsExactPredecessorGeneration
INVARIANT ActiveBranchBaseIdentityMatchesRoot
INVARIANT SourceFenceExcludesRoots
INVARIANT TargetActivationRequiresVisibleManifest
INVARIANT VisibleManifestRequiresRoot
INVARIANT ActivationRequiresBranchSafeSubsystems
INVARIANT TargetConfigMatchesSourceSnapshot
INVARIANT ConfigFreezeLinearizesWithIndexConfigUpdate
INVARIANT ActivationUsesOneFencedPolicyHead
INVARIANT PolicyMutationCannotPassActivationGuard
INVARIANT GuardRemovalRevokesStaleActivationOrObservesActive
INVARIANT RootRemovalRequiresTargetVisibilityGone
INVARIANT RootRemovalRequiresReaderGrace
INVARIANT VisibilityRemovalRequiresDestructionEvidence
INVARIANT EachDestructiveBoundaryUsesFreshPreservationHead
INVARIANT SuccessfulForkIsIdempotent
INVARIANT SourceWritesDoNotChangeTargetBase
INVARIANT TargetWritesDoNotChangeSource
INVARIANT FreshIncarnationPreventsCycles
INVARIANT ParentRelationIsAcyclicAndDepthBounded
INVARIANT NestedOriginClosureRemainsRooted
INVARIANT MaterializationKeepsHistoricalForeignRefsRooted
INVARIANT FailedForkIsNeverReportedSuccess
INVARIANT ActivationAndPreparedCancelAreMutuallyExclusive
INVARIANT PreparedCancelCannotLeaveOrphanRoot
INVARIANT ReservedNoRootCanCancelAfterParentDeletion
