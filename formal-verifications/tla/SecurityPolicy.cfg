\* SecurityPolicy TLC configuration.
\*
\* Run with:
\*   java -jar tla2tools.jar -config SecurityPolicy.cfg SecurityPolicy.tla
\*
\* Expected: all invariants hold. Two nodes are enough to model a stale CAS
\* loser and a remote authorization cache that misses a visible revocation.

CONSTANTS
  Nodes = {"node-a", "node-b"}
  Versions = {1, 2, 3}
  MaxTime = 4
  RevocationBound = 2
  AllowNonCasPublish = FALSE
  AllowStaleAuthorization = FALSE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT CasHeadVersionNeverRegresses
INVARIANT NoAllowPastVisibleRevocationBound
